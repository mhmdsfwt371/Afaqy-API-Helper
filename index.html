<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد الإنتجريشن — دعم أفاقي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101A24">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مساعد الإنتجريشن">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --ink:#101A24; --ink-2:#33475C; --muted:#64788B;
  --surface:#E7ECF1; --panel:#FFFFFF; --panel-2:#F3F6F9;
  --line:#C6D2DC; --line-soft:#DFE7ED;
  --signal:#00707F; --signal-deep:#004F5A; --signal-soft:#D9EEF0;
  --alert:#A94B08; --alert-soft:#FBEADC;
  --ok:#1F6B45; --ok-soft:#DCEFE4;
  --code-bg:#0E1A22; --code-ink:#D8E6EA;
  --ar: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Dubai", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body.en{ --ar: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body.en .rp, body.en .path{ text-align:left }
body{
  background:var(--surface); color:var(--ink); font-family:var(--ar);
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
code,kbd,.mono{font-family:var(--mono); direction:ltr; unicode-bidi:isolate; text-align:left}
.lat{direction:ltr; unicode-bidi:isolate; display:inline-block}
button{font-family:inherit; font-size:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--signal); outline-offset:2px}

/* ---------- header ---------- */
.top{background:var(--ink); color:#E8EFF3; padding:12px 18px 0}
.top-in{max-width:1320px; margin:0 auto; display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between}
.brand{display:flex; align-items:baseline; gap:10px}
.brand b{font-size:17px; font-weight:700}
.brand span{font-size:11px; color:#8FA6B4; font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase}
.conn{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding-bottom:12px}
.pill{font-size:12px; padding:4px 11px; border-radius:99px; border:1px solid #33475C; background:#1C2A36; color:#8FA6B4; white-space:nowrap}
.pill.on{background:#0E3F35; border-color:#1F6B45; color:#7FD4B0}
.pill.bad{background:#4A2412; border-color:#8A4A1C; color:#F0B48A}
.conn label{font-size:11px; color:#8FA6B4; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase}
.conn select,.conn input{
  background:#1C2A36; color:#E8EFF3; border:1px solid #33475C; border-radius:var(--r);
  padding:6px 9px; font-size:13px; font-family:var(--mono); direction:ltr; text-align:left;
}
.conn input{width:190px}
/* telemetry ruler — the one decorative motif */
.ruler{height:6px; background:
  repeating-linear-gradient(to right, var(--signal) 0 1px, transparent 1px 9px);
  opacity:.85}

/* ---------- tabs ---------- */
.tabs{background:var(--panel); border-bottom:1px solid var(--line)}
.tabs-in{max-width:1320px; margin:0 auto; display:flex; gap:2px; padding:0 12px}
.tab{background:none; border:0; border-bottom:3px solid transparent; padding:13px 16px; color:var(--muted); font-weight:600}
.tab[aria-selected="true"]{color:var(--signal-deep); border-bottom-color:var(--signal)}
.tab:hover{color:var(--ink)}

.wrap{max-width:1320px; margin:0 auto; padding:18px 12px 60px}
.view[hidden]{display:none}

/* ---------- search ---------- */
.searchbar{position:relative; margin-bottom:8px}
.searchbar input{
  width:100%; padding:16px 46px 16px 16px; font-size:17px; font-family:inherit;
  border:2px solid var(--ink); border-radius:var(--r); background:var(--panel); color:var(--ink)
}
.searchbar input::placeholder{color:#93A4B3}
.searchbar .ic{position:absolute; inset-inline-start:16px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:16px}
.hintrow{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; align-items:center}
.hintrow small{color:var(--muted); font-size:12px}
.chip{
  background:var(--panel); border:1px solid var(--line); border-radius:99px;
  padding:4px 11px; font-size:12.5px; color:var(--ink-2)
}
.chip:hover{border-color:var(--signal); color:var(--signal-deep)}

.grid{display:grid; grid-template-columns:minmax(280px,1fr) minmax(0,1.65fr); gap:14px; align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
@media(max-width:760px){
  .top-in{flex-direction:column; align-items:stretch; gap:8px}
  .brand{justify-content:space-between}
  .conn{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding-bottom:10px}
  .conn select,.conn input{width:100% !important}
  .conn .btn{width:100%}
  .conn #sesState,.conn #unitState{grid-column:1/-1; text-align:center}
  .tabs-in{overflow-x:auto; -webkit-overflow-scrolling:touch; padding:0 8px}
  .tab{white-space:nowrap; padding:12px 12px; font-size:14px}
  .searchbar input{font-size:16px}          /* أقل من 16 بيخلي آيفون يزوّم لوحده */
  .results{max-height:none}
  .pre{font-size:11.5px}
  .btn{padding:10px 14px}                   /* هدف لمس أكبر */
  .chip{padding:7px 12px}
}
@media(display-mode:standalone){ .instBar{display:none !important} }

.col-h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
.col-h h2{margin:0; font-size:13px; font-family:var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}
.col-h em{font-style:normal; font-size:12px; color:var(--muted); font-family:var(--mono)}

.results{display:flex; flex-direction:column; gap:6px; max-height:72vh; overflow:auto; padding-inline-end:4px}
.res{
  display:block; width:100%; text-align:start; background:var(--panel); border:1px solid var(--line-soft);
  border-radius:var(--r); padding:10px 12px; border-inline-start:3px solid var(--line)
}
.res:hover{border-color:var(--line); border-inline-start-color:var(--signal); background:var(--panel-2)}
.res[aria-current="true"]{border-inline-start-color:var(--signal); background:var(--signal-soft); border-color:var(--signal)}
.res .rp{font-family:var(--mono); font-size:12.5px; color:var(--signal-deep); direction:ltr; text-align:left; word-break:break-all}
.res .rn{font-size:13.5px; color:var(--ink); font-weight:600; margin-top:2px}
.res .rg{font-size:11.5px; color:var(--muted)}

.m{font-family:var(--mono); font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:2px; letter-spacing:.06em}
.m-POST{background:var(--signal-soft); color:var(--signal-deep)}
.m-GET{background:var(--ok-soft); color:var(--ok)}
.m-DELETE{background:var(--alert-soft); color:var(--alert)}
.m-PUT{background:#F3E9CF; color:#7A5A08}

/* ---------- detail ---------- */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r)}
.p-head{padding:14px 18px; border-bottom:1px solid var(--line-soft);
  position:sticky; top:0; background:var(--panel); z-index:3}
@media(max-width:900px){ .p-head{position:static} }
.p-head .path{font-family:var(--mono); font-size:16px; color:var(--ink); direction:ltr; text-align:left; word-break:break-all; margin-top:6px; font-weight:600}
.p-head .crumb{font-size:12px; color:var(--muted)}
.why{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; align-items:center}
.why b{font-size:11px; color:var(--muted); font-weight:600}
.why span{background:var(--panel-2); border:1px solid var(--line-soft); border-radius:2px; padding:1px 7px; font-size:11.5px; color:var(--ink-2)}

.sec{padding:14px 18px; border-top:1px solid var(--line-soft)}
.sec > h3{margin:0 0 8px; font-size:12px; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600}
.pre{
  background:var(--code-bg); color:var(--code-ink); border-radius:var(--r); padding:12px 14px;
  font-family:var(--mono); font-size:12.5px; line-height:1.6; direction:ltr; text-align:left;
  white-space:pre; margin:0; overflow-x:auto; overflow-y:visible
}
/* الطويل بيتقفل بتدريج بدل سكرول جوه سكرول */
.preWrap{position:relative}
.preWrap.clip .pre{max-height:300px; overflow:hidden}
.preWrap.clip::after{content:''; position:absolute; inset-inline:0; bottom:34px; height:60px;
  background:linear-gradient(to bottom, rgba(14,26,34,0) 0%, var(--code-bg) 95%); pointer-events:none; border-radius:0 0 var(--r) var(--r)}
.preMore{display:block; width:100%; margin-top:-1px; padding:7px; border:1px solid var(--line-soft);
  border-top:0; border-radius:0 0 var(--r) var(--r); background:var(--panel-2); color:var(--signal-deep);
  font-size:12.5px; font-weight:600}
.preMore:hover{background:var(--signal-soft)}
.pre .tk{color:#5FD3C4}
.codetabs{display:flex; gap:2px; margin-bottom:6px}
.ct{background:var(--panel-2); border:1px solid var(--line-soft); border-bottom:0; border-radius:var(--r) var(--r) 0 0; padding:5px 12px; font-size:12px; color:var(--muted); font-family:var(--mono)}
.ct[aria-selected="true"]{background:var(--code-bg); color:#fff; border-color:var(--code-bg)}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.btn{
  background:var(--ink); color:#fff; border:1px solid var(--ink); border-radius:var(--r);
  padding:8px 14px; font-weight:600; font-size:13.5px
}
.btn:hover{background:#1E2E3C}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink); background:var(--panel-2)}
.btn.sig{background:var(--signal); border-color:var(--signal)}
.btn.sig:hover{background:var(--signal-deep)}
.btn.warn{background:transparent; color:var(--alert); border-color:#E3C3A6}
.btn.warn:hover{background:var(--alert-soft)}
.btn[disabled]{opacity:.45; cursor:not-allowed}

table.kv{width:100%; border-collapse:collapse; font-size:13px}
table.kv td{border-bottom:1px solid var(--line-soft); padding:6px 4px; vertical-align:top}
table.kv td:first-child{font-family:var(--mono); color:var(--signal-deep); width:38%; direction:ltr; text-align:left}

.note{background:var(--panel-2); border-inline-start:3px solid var(--line); padding:10px 12px; border-radius:0 var(--r) var(--r) 0; font-size:13px; color:var(--ink-2)}
.note.warn{background:var(--alert-soft); border-inline-start-color:var(--alert); color:#6B3105}
.note.sig{background:var(--signal-soft); border-inline-start-color:var(--signal); color:var(--signal-deep)}

.empty{padding:44px 22px; text-align:center; color:var(--muted)}
.empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:6px}

/* ---------- faq / browse ---------- */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px}
.card h3{margin:0 0 8px; font-size:15px}
.card p{margin:0 0 8px; font-size:13.5px; color:var(--ink-2)}
.card .pre{font-size:12px; max-height:none}
.tagv{display:inline-block; background:var(--ok-soft); color:var(--ok); font-size:11px; padding:1px 7px; border-radius:2px; font-weight:600}
.tagu{display:inline-block; background:var(--alert-soft); color:var(--alert); font-size:11px; padding:1px 7px; border-radius:2px; font-weight:600}

details.grp{background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r); margin-bottom:6px}
details.grp > summary{padding:11px 14px; cursor:pointer; font-weight:600; display:flex; justify-content:space-between; align-items:center}
details.grp > summary::-webkit-details-marker{display:none}
details.grp > summary small{color:var(--muted); font-family:var(--mono); font-size:11.5px; font-weight:400}
details.grp[open] > summary{border-bottom:1px solid var(--line-soft)}
.glist{padding:6px}

/* ---------- modal ---------- */
.mask{position:fixed; inset:0; background:rgba(16,26,36,.62); display:flex; align-items:center; justify-content:center; padding:18px; z-index:50}
.mask[hidden]{display:none}
.modal{background:var(--panel); border-radius:var(--r); max-width:760px; width:100%; max-height:88vh; overflow:auto}
.modal .mh{padding:14px 18px; border-bottom:1px solid var(--line-soft); display:flex; gap:10px;
  justify-content:space-between; align-items:center;
  position:sticky; top:0; background:var(--panel); z-index:2}
.mx{background:none; border:1px solid var(--line); border-radius:3px; width:34px; height:34px;
  font-size:20px; line-height:1; color:var(--muted); padding:0; flex:none}
.mx:hover{border-color:var(--alert); color:var(--alert); background:var(--alert-soft)}
.modal .mh h3{margin:0; font-size:16px}
.modal .mb{padding:16px 18px}
textarea.out{width:100%; min-height:230px; font-family:var(--mono); font-size:12.5px; direction:ltr; text-align:left;
  border:1px solid var(--line); border-radius:var(--r); padding:12px; background:var(--panel-2); color:var(--ink); line-height:1.6}
textarea.ar{direction:rtl; text-align:right; font-family:var(--ar); font-size:14px; min-height:150px}

.toast{position:fixed; bottom:22px; inset-inline-start:22px; background:var(--ink); color:#fff; padding:11px 18px; border-radius:var(--r); font-size:13.5px; z-index:60; box-shadow:0 6px 22px rgba(16,26,36,.28)}
.toast[hidden]{display:none}
@media(max-width:760px){
  .top{padding:8px 12px 0}
  .top-in{gap:8px}
  .brand b{font-size:15px}
  .conn{width:100%; gap:6px; padding-bottom:8px}
  .conn input{flex:1 1 120px; min-width:0; width:auto}
  .conn select{flex:1 1 100%}
  .conn label{display:none}
  .tabs-in{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .tabs-in::-webkit-scrollbar{display:none}
  .tab{padding:11px 12px; font-size:13.5px; white-space:nowrap}
  .wrap{padding:12px 10px 48px}
  .searchbar input{font-size:16px; padding:13px 40px 13px 13px}   /* 16px يمنع الزوم في آيفون */
  .results{max-height:none}
  .row{gap:6px}
  .btn{padding:9px 12px; font-size:13.5px}
  .sec{padding:12px 13px}
  .p-head{padding:12px 13px}
  .cards{grid-template-columns:1fr}
  .modal{max-height:94vh}
  table.kv td:first-child{width:42%}
}
@media print{
  .top,.ruler,.tabs,.row,.toast,.mask{display:none !important}
  body{background:#fff}
  .panel{border-color:#999; break-inside:avoid}
  .wrap{max-width:none; padding:0}
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .18s ease-out}
  @keyframes up{from{opacity:0; transform:translateY(8px)}}
}
</style>
</head>
<body>

<div id="instBar" class="instBar" hidden style="background:#1C2A36; color:#E8EFF3; padding:10px 18px; font-size:14px">
  <div style="max-width:1320px; margin:0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap">
    <span id="instMsg" style="flex:1"></span>
    <button class="btn" id="instGo" style="background:#00707F; border-color:#00707F; padding:6px 16px">تثبيت</button>
    <button class="btn ghost" id="instSkip" style="color:#8FA6B4; border-color:#33475C; padding:6px 12px">لأ شكرًا</button>
  </div>
</div>
<div id="updBar" hidden style="background:#00707F; color:#fff; padding:10px 18px; font-size:14px">
  <div style="max-width:1320px; margin:0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap">
    <span id="updMsg" style="flex:1"></span>
    <button class="btn" id="updGo" style="background:#fff; color:#00707F; border-color:#fff; padding:6px 16px">تحديث</button>
    <button class="btn ghost" id="updSkip" style="color:#CFF0F2; border-color:#4E9AA3; padding:6px 12px">بعدين</button>
  </div>
</div>
<header class="top">
  <div class="top-in">
    <div class="brand"><b data-ar="مساعد الإنتجريشن" data-en="Integration Helper">مساعد الإنتجريشن</b><span id="verTag">v—</span></div>
    <div class="conn">
      <label for="baseUrl">Base URL</label>
      <select id="baseUrl">
        <option value="https://api.afaqy.sa">https://api.afaqy.sa</option>
        <option value="https://apibeta.afaqy.pro">https://apibeta.afaqy.pro</option>
        <option value="http://api.stageavl.afaqy.sa">http://api.stageavl.afaqy.sa</option>
        <option value="__custom">أخرى…</option>
      </select>
      <input id="baseCustom" placeholder="https://…" hidden>
      <input id="sesU" data-arph="اسم المستخدم" data-enph="Username" placeholder="اسم المستخدم" autocomplete="off" style="width:130px; font-family:var(--ar); text-align:right; direction:rtl">
      <input id="sesP" type="password" data-arph="كلمة السر" data-enph="Password" placeholder="كلمة السر" autocomplete="off" style="width:120px; font-family:var(--ar); text-align:right; direction:rtl">
      <button class="btn sig" id="sesGo" style="padding:6px 14px; font-size:13px" data-ar="اتصال" data-en="Connect">اتصال</button>
      <span id="sesState" class="pill">غير متصل</span>
      <span id="unitSep" style="color:#33475C" hidden>|</span>
      <input id="unitIn" hidden placeholder="IMEI" autocomplete="off" style="width:150px"
             data-arph="IMEI أو الاسم" data-enph="IMEI or name">
      <button class="btn sig" id="unitGo" hidden style="padding:6px 12px; font-size:13px" data-ar="حدّد العربية" data-en="Set vehicle">حدّد العربية</button>
      <span id="unitState" class="pill" hidden>—</span>
      <button class="btn ghost" id="langBtn" style="padding:6px 12px; font-size:12px; color:#C7D6DF; border-color:#33475C; font-family:var(--mono)">EN</button>
      <button class="btn ghost" id="sesCopy" style="padding:6px 10px; font-size:12px; color:#C7D6DF; border-color:#33475C" hidden data-ar="نسخ التوكن" data-en="Copy token">نسخ التوكن</button>
      <button class="btn ghost" id="sesOut" style="padding:6px 10px; font-size:12px; color:#C7D6DF; border-color:#33475C" hidden data-ar="قطع" data-en="Disconnect">قطع</button>
    </div>
  </div>
</header>
<div class="ruler"></div>

<nav class="tabs"><div class="tabs-in" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-view="triage"><span data-ar="ابدأ من هنا" data-en="Start here">ابدأ من هنا</span></button>
  <button class="tab" role="tab" aria-selected="false" data-view="search"><span data-ar="الريكوستات" data-en="Requests">الريكوستات</span></button>
  <button class="tab" role="tab" aria-selected="false" data-view="recipes"><span data-ar="سيناريوهات جاهزة" data-en="Ready scenarios">سيناريوهات جاهزة</span></button>
  <button class="tab" role="tab" aria-selected="false" data-view="docs"><span data-ar="الدليل" data-en="Guide">الدليل</span></button>
  <button class="tab" role="tab" aria-selected="false" data-view="faq"><span data-ar="أساسيات الإنتجريشن" data-en="Integration basics">أساسيات الإنتجريشن</span></button>
</div></nav>

<main class="wrap">

<!-- ================= SEARCH ================= -->
<section class="view" id="v-search">
  <div class="searchbar">
    <span class="ic">⌕</span>
    <input id="q" data-arph="اكتب سؤال العميل بالعربي أو بالإنجليزي… مثلاً: عايز أجيب لستة العربيات" data-enph="Type the customer\u0027s question… e.g. how do I list vehicles" placeholder="اكتب سؤال العميل بالعربي أو بالإنجليزي… مثلاً: عايز أجيب لستة العربيات" autocomplete="off">
  </div>
  <div class="hintrow" id="recent"></div>
  <div class="hintrow">
    <small data-ar="جرّب:" data-en="Try:">جرّب:</small>
    <button class="chip" data-ex="إزاي أعمل تسجيل دخول وآخد توكن"><span data-ar="تسجيل دخول وتوكن" data-en="Login &amp; token">تسجيل دخول وتوكن</span></button>
    <button class="chip" data-ex="لستة العربيات"><span data-ar="لستة العربيات" data-en="List vehicles">لستة العربيات</span></button>
    <button class="chip" data-ex="آخر موقع للعربية"><span data-ar="آخر موقع للعربية" data-en="Last location">آخر موقع للعربية</span></button>
    <button class="chip" data-ex="لستة السواقين"><span data-ar="السواقين" data-en="Drivers">السواقين</span></button>

const AUTH = {

  allowedDomain: 'afaqy.com',           // إيميلات الدومين ده بس

  }
};

function authGate(done){
  if(!AUTH.enabled) return done();
  document.body.style.visibility='hidden';
  const shell=document.createElement('div');
  shell.style.cssText='position:fixed; inset:0; background:#101A24; color:#E8EFF3; display:flex;'+
    'align-items:center; justify-content:center; z-index:9999; visibility:visible; font-family:'+
    '"Segoe UI",Tahoma,Arial,sans-serif; direction:rtl';
  shell.innerHTML='<div style="width:320px; text-align:center">'+
    '<div style="font-size:18px; font-weight:700; margin-bottom:4px">مساعد الإنتجريشن</div>'+
    '<div style="font-size:12px; color:#8FA6B4; margin-bottom:18px">دعم أفاقي — استخدام داخلي</div>'+
    '<input id="gEmail" placeholder="إيميل الشغل" style="width:100%; padding:10px; margin-bottom:8px; border-radius:3px; border:1px solid #33475C; background:#1C2A36; color:#E8EFF3; direction:ltr; text-align:left">'+
    '<input id="gPass" type="password" placeholder="كلمة السر" style="width:100%; padding:10px; margin-bottom:12px; border-radius:3px; border:1px solid #33475C; background:#1C2A36; color:#E8EFF3">'+
    '<button id="gGo" style="width:100%; padding:10px; border:0; border-radius:3px; background:#00707F; color:#fff; font-size:15px; cursor:pointer">دخول</button>'+
    '<div id="gErr" style="color:#F0B48A; font-size:13px; margin-top:10px; min-height:18px"></div></div>';
  document.body.appendChild(shell);

  const load = (src)=> new Promise((ok,no)=>{ const s2=document.createElement('script'); s2.src=src; s2.onload=ok; s2.onerror=no; document.head.appendChild(s2); });
  Promise.all([
    load('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'),
    load('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js')
  ]).then(()=>{
    firebase.initializeApp(AUTH.firebase);
    const enter = ()=>{ shell.remove(); document.body.style.visibility='visible'; done(); };
    firebase.auth().onAuthStateChanged(u=>{
      if(u && (!AUTH.allowedDomain || (u.email||'').endsWith('@'+AUTH.allowedDomain))) enter();
    });
    document.getElementById('gGo').onclick = ()=>{
      const em=document.getElementById('gEmail').value.trim(), pw=document.getElementById('gPass').value;
      const err=document.getElementById('gErr'); err.textContent='بيتأكد…';
      if(AUTH.allowedDomain && !em.endsWith('@'+AUTH.allowedDomain)){ err.textContent='الإيميل لازم يكون على '+AUTH.allowedDomain; return; }
      firebase.auth().signInWithEmailAndPassword(em, pw)
        .then(enter)
        .catch(e=>{ err.textContent = /user-not-found|invalid-credential|wrong-password/.test(e.code||'')
          ? 'البيانات غلط، أو الحساب مش متعمل لسه.' : 'ما قدرناش نتحقق: '+(e.code||e.message); });
    };
    document.getElementById('gPass').addEventListener('keydown', ev=>{ if(ev.key==='Enter') document.getElementById('gGo').click(); });
  }).catch(()=>{
    document.getElementById('gErr').textContent='ما قدرناش نحمّل مكتبة الدخول — اتأكد من النت.';

}

/* ============ التثبيت على الجهاز ============
   الخدمة بتشتغل على الاستضافة بس. لو الملف مفتوح من الجهاز بتتخطى من غير خطأ. */
function initPWA(){
  if(typeof navigator!=='undefined' && 'serviceWorker' in navigator &&
     String(location.protocol||'').indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  let deferred=null;
  if(typeof window==='undefined' || !window.addEventListener) return;
  const dismissed = (()=>{ try{ return sessionStorage.getItem('instOff')==='1'; }catch(_){ return false; } })();
  window.addEventListener('beforeinstallprompt', ev=>{
    if(dismissed) return;
    ev.preventDefault(); deferred=ev;
    const bar=$('instBar'); if(!bar) return;
    $('instMsg').textContent = t('تقدر تثبّت الأداة على الجهاز وتفتحها زي أي تطبيق.',
                                 'You can install this on your device and open it like any app.');
    bar.hidden=false;
    $('instGo').onclick = async ()=>{ bar.hidden=true; deferred.prompt();
      try{ await deferred.userChoice; }catch(_){ } deferred=null; };
    $('instSkip').onclick = ()=>{ $('instBar').hidden = true; try{ sessionStorage.setItem('instOff','1'); }catch(_){} };
  });
  /* آيفون مالوش دعوة تلقائية — بنشرحها بنفسنا */
  const ua = (typeof navigator!=='undefined' && navigator.userAgent) || '';
  const iOS = /iphone|ipad|ipod/i.test(ua);
  const standalone = (typeof navigator!=='undefined' && navigator.standalone===true) ||
                     (typeof window!=='undefined' && window.matchMedia &&
                      window.matchMedia('(display-mode: standalone)').matches);
  if(iOS && !standalone){
    const bar=$('instBar'); if(!bar) return;
    $('instMsg').innerHTML = t('عايز تثبتها على الآيفون؟ اضغط زرار المشاركة تحت، وبعدين «إضافة إلى الشاشة الرئيسية».',
                               'To install on iPhone: tap the Share button below, then "Add to Home Screen".');
    $('instGo').hidden = true;
    bar.hidden = false;
    $('instSkip').onclick = ()=>{ $('instBar').hidden = true; try{ sessionStorage.setItem('instOff','1'); }catch(_){} };
  }
}

/* ============ التحديث الذاتي ============
   الأداة بتسأل السيرفر كل شوية: في نسخة أحدث؟ لو أيوه بتقولك وبتحدّث نفسها.
   من غير كده الفريق هيفضل شغال على نسخة قديمة مخزّنة في المتصفح من غير ما يعرف. */
let UPD_SEEN = null;
async function checkUpdate(silent){
  try{
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const v = await r.json();
    if(!v || !v.version) return;
    /* أحدث فعلًا، مش مجرد مختلفة. ملف النسخة ممكن يتأخر في الكاش
       ويقول رقم أقدم — وساعتها الشريط كان هيقول «في نسخة أحدث» وهي أقدم. */
    const num = x => String(x||'0').split('.').map(n=>parseInt(n,10)||0);
    const a = num(v.version), b2 = num(DOCS.version);
    let newer = false;
    for(let i=0;i<Math.max(a.length,b2.length);i++){
      const x=a[i]||0, y=b2[i]||0;
      if(x>y){ newer=true; break; }
      if(x<y) break;
    }
    if(!newer) return;
    if(UPD_SEEN === v.version) return;
    UPD_SEEN = v.version;
    const items = (v.notes && (LANG==='en' ? v.notes.en : v.notes.ar)) || [];
    $('updMsg').innerHTML = `<b>${t('في نسخة أحدث','A newer version is available')}: v${esc(v.version)}</b>`
      + (items.length ? ` — ${esc(items.slice(0,2).join('، '))}` : '')
      + `<br><span style="opacity:.85; font-size:12.5px">${t('اللي عندك دلوقتي','You are on')} v${esc(DOCS.version)}</span>`;
    $('updBar').hidden = false;
  }catch(_){ /* شغال من الجهاز أو مفيش نت — عادي */ }
}
/* التحديث لازم يفك كل طبقات الكاش: كاش الأداة، وخدمة الخلفية، وكاش المتصفح.
   من غير كده الشريط بيفضل يطلع مهما عملت تحديث. */
async function applyUpdate(){
  const hash = location.hash || '';
  const btn = $('updGo'); if(btn){ btn.disabled = true; btn.textContent = t('بيحدّث…','Updating…'); }
  try{
    if(typeof caches !== 'undefined' && caches.keys){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  }catch(_){}
  try{
    if(navigator.serviceWorker){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  }catch(_){}
  location.replace(location.pathname + '?v=' + Date.now() + hash);
}

        "ar": "اللي مقفول وليه",
        "en": "What is blocked and why"
      },
      "b": {
        "ar": [
          "التصحيح التلقائي مقفول على أي ريكوست بيعدّل أو بيمسح أو بيبعت. إعادة المحاولة على حاجة زي دي ممكن تعمل ضرر في حساب عميل.",
          "إعادة المحاولة مقفولة على كل ريكوستات الدخول. محاولات الدخول المتكررة بتقفل الحسابات.",
          "الأداة مابتخترعش ريكوست. لو الحاجة مش في الكولكشن بتقولك وبتوقف.",
          "التوكن بيتشال أوتوماتيك من أي نص قبل ما تنسخه.",
          "كلمة السر مابتتعرضش. بتشوف بصمتها بس — طولها وأنواع حروفها وتحذير لو فيها مسافة زيادة."
        ],
        "en": [
          "Auto-fix is disabled on any request that modifies, deletes, or sends. Retrying one of those can damage a customer account.",
          "Retry is disabled on all login requests. Repeated login attempts lock accounts.",
          "The tool never invents a request. If something is not in the collection it says so and stops.",
          "The token is stripped automatically from any text before you copy it.",
          "Passwords are never displayed. You see only a fingerprint — length, character types, and a warning if there is stray whitespace."
        ]
      }
    },
    {
      "id": "fail",
      "since": "1.2",
      "t": {
        "ar": "لما حاجة تفشل",
        "en": "When something fails"
      },
      "b": {
        "ar": [
          "أول حاجة: بص على صندوق «الريكوست اللي اتبعت فعلاً» تحت النتيجة. بيوريك بالحرف الرابط والهيدرز والبودي.",
          "الأداة بتقرا رد السيرفر وبتقولك أنهي حقل اترفض وليه بالاسم.",
          "خد بالك: الأكواد الرقمية في السيستم ده مش قياسية. شفنا 405 معناها خطأ بيانات مش «ميثود غلط»، و401 جوه رد 200.",
          "القاعدة: اقرا message و errors من البودي. الرقم آخر حاجة تبص عليها.",
          "لو رجع unit_id: not_found — يبقى البودي لسه فيه رقم العينة. حدّد عربية بالـ IMEI من فوق.",
          "لو الريكوست نجح، اضغط «نسخ رد كامل للعميل» — بيديك الإندبوينت والبودي والرد في بلوك واحد جاهز للإيميل."
        ],
        "en": [
          "First: look at the \"what was actually sent\" panel under the result. It shows the URL, headers, and body exactly.",
          "The tool reads the server response and tells you which field was rejected and why, by name.",
          "Note: the numeric codes on this platform are not standard. We have seen 405 mean a data error, and 401 inside a 200 response.",
          "The rule: read message and errors from the body. The number is the last thing to look at.",
          "If you get unit_id: not_found, the body still carries the sample id. Set a vehicle by IMEI in the top bar.",
          "If the request succeeded, press \"Copy full reply for the customer\" — you get the endpoint, body, and response in one email-ready block."
        ]
      }
    },
    {
      "id": "escalate",
      "since": "1.0",
      "t": {
        "ar": "التصعيد",
        "en": "Escalation"
      },
      "b": {
        "ar": [
          "زرار التصعيد بيفتح قايمة أدلة لازم تأشّر عليها: الـ curl كامل، الرد كامل، البيئة والوقت، UID عربية واحدة، واللي جربته انت.",
          "الرسالة بتتكتب لوحدها وبتقول صراحة إيه المرفق وإيه الناقص، وبتضم سجل اللي الأداة نفّذته في الجلسة.",
          "كل بند ناقص بيرجّع التذكرة بسؤال وبيضيّع يومين."
        ],
        "en": [
          "The escalate button opens an evidence checklist: the full curl, the full response, the environment and time, one vehicle UID, and what you already tried.",
          "The message is written for you, states plainly what is attached and what is missing, and includes the log of what the tool ran this session.",
          "Every missing item bounces the ticket back with a question and costs two days."
        ]
      }
    },
    {
      "id": "grow",
      "since": "1.0",
      "t": {
        "ar": "المعرفة لازم تكبر",
        "en": "The knowledge has to grow"
      },
      "b": {
        "ar": [
          "في تبويب أساسيات الإنتجريشن فورم «ضيف معلومة جديدة».",
          "أول ما تيم مصر يرد عليك بحاجة مش موجودة في الأداة، سجّلها في نفس اللحظة وصدّرها وابعت الملف لمسؤول الأداة.",
          "المسؤول بيجمّع الملفات أسبوعيًا ويرفع نسخة محدّثة.",
          "من غير الخطوة دي الأداة هتبقى قديمة خلال شهرين."
        ],
        "en": [
          "The integration basics tab has an \"add a new entry\" form.",
          "The moment development answers something the tool does not already cover, record it immediately, export it, and send the file to whoever maintains the tool.",
          "That person merges the files weekly and publishes an updated version.",
          "Without this step the tool goes stale within two months."
        ]
      }
    },
    {
      "id": "rule",
      "since": "1.7",
      "t": {
        "ar": "قاعدة التحديث",
        "en": "The update rule"
      },
      "b": {
        "ar": [
          "كل نسخة ليها رقم، والرقم ظاهر فوق في الشريط.",
          "الدليل بيتنزّل من جوه الأداة نفسها — تبويب «الدليل» ← زرار «نزّل الدليل».",
          "أي تعديل في الأداة لازم يتسجّل في الدليل والملف المطبوع، في نفس الوقت.",
          "الجديد في كل نسخة بيتعلّم بلون مختلف عشان تقرا الفرق بسرعة.",
          "**قبل أي نشر، كل الاختبارات بتتشغّل.** لو واحد فشل، البناء بيقف ومفيش نشر. مش وعد — الكود بيمنعه.",
          "**الأداة بتقول لوحدها لما تنزل نسخة أحدث.** الفريق ما يفضلش شغال على نسخة قديمة من غير ما يعرف.",
          "دليل قديم أخطر من إنه ما يكونش موجود، لأن الناس بتصدّقه."
        ],
        "en": [
          "Every release has a number, shown in the top bar.",
          "The guide downloads from inside the tool — the Guide tab, then \"Download the guide\".",
          "Any change must be recorded in the guide and the printed file at the same time.",
          "What is new in each release is marked in a different colour so you can read the difference quickly.",
          "**Before any publish, every test runs.** If one fails the build stops and nothing ships. Not a promise — the code enforces it.",
          "**The tool announces newer versions itself.** The team never keeps running an old copy unknowingly.",
          "An outdated guide is more dangerous than no guide, because people believe it."
        ]
      }
    },
    {
      "id": "removed",
      "since": "1.6",
      "t": {
        "ar": "ريكوستات متشالة عن قصد",
        "en": "Requests deliberately removed"
      },
      "b": {
        "ar": [
          "إضافة العربيات وحذفها مش موجودين في الأداة. لو دوّرت عليهم مش هتلاقيهم، وده مقصود.",
          "السبب: الدعم بيشخّص ويشرح، مش بيعمل ولا بيمسح عربيات في حساب عميل.",
          "المتشال: /units/add و /units/delete و /units/bulk-delete و /units/delete_forever و /units/bulk-delete-forever.",
          "لو حالة محتاجة واحد منهم فعلًا، دي تروح للفريق اللي مسؤول عنها مش للدعم."
        ],
        "en": [
          "Adding and deleting vehicles are not in the tool. Searching for them returns nothing, and that is intentional.",
          "The reason: support diagnoses and explains; it does not create or destroy vehicles in a customer account.",
          "Removed: /units/add, /units/delete, /units/bulk-delete, /units/delete_forever, /units/bulk-delete-forever.",
          "If a case genuinely needs one of these, it goes to the team that owns it, not to support."
        ]
      }
    }
  ]

   والأرقام العربية والفارسية بتترجع لأرقام عادية عشان الـ IMEI يشتغل مهما اتكتب إزاي */
const AR_DIGITS = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
                   '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
const norm = s => (s||'')
  .replace(/[٠-٩۰-۹]/g, d => AR_DIGITS[d] || d)
  .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
  .replace(/ئ/g,'ي').replace(/ؤ/g,'و').replace(/ء/g,'')
  .replace(/[\u064B-\u0652\u0640]/g,'')
  .replace(/\s+/g,' ')
  .toLowerCase().trim();

/* الإندبوينت الواحد لو موجود في أكتر من فولدر = التباس، لازم يتحذّر منه */
const DUP = {};
EPS.forEach(e=>{ if(e.p && e.p.startsWith('/')) (DUP[e.m+' '+e.p] = DUP[e.m+' '+e.p]||[]).push(e); });
Object.keys(DUP).forEach(k=>{ if(new Set(DUP[k].map(x=>x.g)).size < 2) { delete DUP[k]; return; }
  const seg = k.split(' ')[1].replace(/^\//,'').split('/')[0].replace(/[_-]/g,'').toLowerCase();
  DUP[k].forEach(x=>{
    const g = x.g.toLowerCase().replace(/[^a-z]/g,'');
    x._weak = !(g.includes(seg.slice(0,5)) || seg.includes(g.slice(0,5)));  // فولدر منسوخ وإندبوينته بتاع موديول تاني
  });
});
const dupOf = e => DUP[e.m+' '+e.p] || null;

Object.entries(ACTIONS).forEach(([k,v])=>{ ACTIONS_N[k] = v.map(x=>[norm(x), x]); });

EPS.forEach(e=>{
  e._full = (e.g + ' ' + (e.s||'') + ' ' + e.n + ' ' + e.p).toLowerCase();
  e._nn = norm(e.g + ' ' + (e.s||'') + ' ' + e.n);
  e._bk = (e.b||'').toLowerCase();
});

function search(raw){
  const qn = norm(raw);
  if(!qn) return [];
  const words = qn.split(/[\s،,.؟?/\\-]+/).filter(w=>w.length>1);
  const scored = [];

  /* المصطلح بيتطابق لو موجود في السؤال، أو لو كلمة من السؤال بداية ليه.
     البادئة دي هي اللي بتخلي البحث يشتغل وانت لسه بتكتب. */
  const termScore = t2 => {
    if(!t2) return 0;
    if(qn.includes(t2)) return t2.length>=4 ? 3 : 2;
    for(const w of words) if(w.length>=3 && t2.startsWith(w)) return 1.7;
    return 0;
  };

  const modHits = {};
  for(const [mod,list] of Object.entries(VOCAB_N)){
    for(const [tn,term] of list){
      const sc = termScore(tn);
      if(sc){
        const base = mod.split('/')[0];
        modHits[base] = Math.max(modHits[base]||0, sc);
        if(!modHits._why) modHits._why = {};
        (modHits._why[base] = modHits._why[base] || []).push(term);
      }
    }
  }
  const why0 = modHits._why||{}; delete modHits._why;

  // which action?
  const actHits = {}; const actWhy = {};
  for(const [act,list] of Object.entries(ACTIONS_N)){
    for(const [tn,term] of list){
      const sc = termScore(tn);
      if(sc){
        actHits[act] = Math.max(actHits[act]||0, sc*0.66);
        (actWhy[act] = actWhy[act]||[]).push(term);
      }
    }
  }

  /* النية بتتحدد من السؤال مرة واحدة. قبل كده كانت 14 × 529 = 7406 اختبار في كل بحثة. */
  const hitIntents = INTENT.filter(it=>it.re.test(qn));

  EPS.forEach(e=>{
    let s = 0; const why = [];
    if(modHits[e.g]){ s += modHits[e.g]*4*(STRONG[e.g]||1); (why0[e.g]||[]).slice(0,2).forEach(w=>why.push(w)); }
    for(const [act,v] of Object.entries(actHits)){
      if(e.n.toLowerCase() === act.toLowerCase()){ s += v*3.2; (actWhy[act]||[]).slice(0,1).forEach(w=>why.push(w)); }
      else if(e.n.toLowerCase().includes(act.toLowerCase())){ s += v*1.4; }
    }
    words.forEach(w=>{
      if(e._nn.includes(w)) s += 2.2;
      else if(e._full.includes(w)) s += 1.8;
      else if(e.p.toLowerCase().includes(w)) s += 1.5;
      else if(e._bk.includes('"'+w+'"')) s += 1.1;
    });
    // نية مباشرة: السؤال ده ليه إجابة واحدة معروفة
    for(const it of hitIntents){
      if(it.p.test(e.p||'')){ s += it.s; why.push(t('سؤال متكرر','common question')); break; }
    }
    // نية الموقع: افصل بين الموقع والعنوان والإشارة
    const wantsLoc = ['موقع','مواقع','لوكيشن','احداثيات','خريطه','location','position','gps'].some(t=>qn.includes(norm(t)));
    const wantsAddr = ['عنوان','address'].some(t=>qn.includes(norm(t)));
    const wantsSig  = ['اشار','سيجنال','اخر تحديث','رسائل الجهاز','signal'].some(t=>qn.includes(norm(t)));
    if(wantsLoc  && /location/i.test(e.n+e.p)) s += 6;
    if(wantsAddr && /address/i.test(e.n+e.p)) s += 6;
    if(wantsSig  && /signal/i.test(e.n+e.p)) s += 6;
    if(s>0){
      if(SAFE.test(e.n)) s -= 1.5;              // خطر: منزّل في الترتيب
      if(e._weak) s -= 7;                       // نسخة مكررة في فولدر غلط
      /* إندبوينتس مش على سيرفر الـ API الأساسي = بروتوكول بين الجهاز والسيرفر،
         الدعم عمره ما هيبعتها لعميل. تحت خالص. */
      if(!e.p.startsWith('/')) s -= 9;
      s *= (CORE[e.g] || 1);                    // موديولز الدعم اليومية تتقدّم عند التعادل
      if(/^(List|Add|Edit|View)$/i.test(e.n)) s += .6;
      scored.push({e, s, why:[...new Set(why)]});
    }
  });
  const all = scored.sort((a,b)=>b.s-a.s);
  const top = all.slice(0,40); top.total = all.length; return top;
}

/* أي بلوك طويل بيتقفل مع زرار «اعرض الكل» — بدل ما يبقى فيه سكرول جواه
   والموظف يلف العجلة والصفحة واقفة. */
function clipBlocks(root){
  if(!root || !root.querySelectorAll) return;
  root.querySelectorAll('pre.pre').forEach(pre=>{
    if(pre.parentElement && pre.parentElement.classList.contains('preWrap')) return;
    if(pre.scrollHeight <= 320) return;
    const wrap = document.createElement('div');
    wrap.className = 'preWrap clip';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    const btn = document.createElement('button');
    btn.className = 'preMore';
    const lines = (pre.textContent.match(/\n/g)||[]).length + 1;
    btn.textContent = t(`اعرض الكل (${lines} سطر)`, `Show all (${lines} lines)`);
    wrap.parentNode.insertBefore(btn, wrap.nextSibling);
    btn.onclick = ()=>{
      const open = wrap.classList.toggle('clip');
      btn.textContent = open ? t(`اعرض الكل (${lines} سطر)`, `Show all (${lines} lines)`)
                             : t('اطوي','Collapse');
      if(open) wrap.scrollIntoView({block:'nearest'});
    };
  });
}

const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const baseUrl = () => $('baseUrl').value === '__custom' ? ($('baseCustom').value.trim() || 'https://BASE_URL') : $('baseUrl').value;
const token = () => (typeof SESSION!=='undefined' && SESSION.token) || TOKEN_MEM || '<YOUR_TOKEN>';

function fullUrl(e, real){
  let u = baseUrl() + e.p;
  const qs = [];
  if(e.t) qs.push('token=' + (real ? encodeURIComponent(token()) : token()));
  (e.q||[]).forEach(q=>{ if(!q.off) qs.push(q.k + '=' + (q.v||'')); });
  return u + (qs.length ? '?' + qs.join('&') : '');
}
function bodyOf(e){ return prepBody(e).text; }

/* ---------------- code generators ---------------- */
function gen(e, mode){
  const url = fullUrl(e,false), b = bodyOf(e), m = e.m || 'POST';
  const hasBody = b && m !== 'GET';
  if(mode==='curl'){
    let s = `curl -X ${m} "${url}" \\\n  -H "Content-Type: application/json"`;
    if(hasBody) s += ` \\\n  -d '${b.replace(/'/g,"'\\''")}'`;
    return s;
  }
  if(mode==='js'){
    return `const res = await fetch("${url}", {\n  method: "${m}",\n  headers: { "Content-Type": "application/json" }${hasBody ? `,\n  body: JSON.stringify(${b})` : ''}\n});\nconst data = await res.json();\nconsole.log(data);`;
  }
  return `import requests\n\nres = requests.${m.toLowerCase()}(\n    "${url}",\n    headers={"Content-Type": "application/json"}${hasBody ? `,\n    json=${b.replace(/\btrue\b/g,'True').replace(/\bfalse\b/g,'False').replace(/\bnull\b/g,'None')}` : ''}\n)\nprint(res.json())`;
}

/* الرد الكامل للعميل: الإندبوينت + البودي + الرد الحقيقي.
   الردود الكبيرة بتتقص — محدش عايز إيميل فيه ألف عربية. */
function trimResponse(json, raw){
  if(!json) return {text: raw||'', trimmed:false, note:''};
  let biggest=null, path='';
  const walk=(o, p2, d)=>{ if(d>6||o==null) return;
    if(Array.isArray(o)){ if(o.length>3 && typeof o[0]==='object' && (!biggest||o.length>biggest.length)){ biggest=o; path=p2; } o.slice(0,3).forEach(x=>walk(x,p2,d+1)); return; }
    if(typeof o==='object') Object.entries(o).forEach(([k,v])=>walk(v, p2?p2+'.'+k:k, d+1));
  };
  walk(json,'',0);
  if(!biggest) return {text: JSON.stringify(json,null,2), trimmed:false, note:''};
  const n = biggest.length;
  const clone = JSON.parse(JSON.stringify(json));
  const parts = path.split('.');
  let ref = clone;
  for(let i=0;i<parts.length-1;i++) ref = ref[parts[i]];
  ref[parts[parts.length-1]] = biggest.slice(0,2);
  return {text: JSON.stringify(clone,null,2), trimmed:true,
          note:`Showing the first 2 of ${n} items in "${path}". The full response returns all ${n}.`};
}

/* آخر تشغيل ناجح — عشان زرار النسخ يدي الرد الحقيقي مهما كنت شغّلته منين */
let LAST_RUN = null;
/* عدّاد الطلبات: لو فتحت ريكوست تاني وانت مستني رد، الرد القديم بيوصل
   ويكتب فوق الشاشة الجديدة. العدّاد بيخلي أي رد متأخر يتجاهل. */
let RUN_SEQ = 0;
function rememberRun(e, sentBody, resp){
  if(resp && resp.ok) LAST_RUN = {i:e.i, body:sentBody, resp};
}
function packetFor(e){
  if(LAST_RUN && LAST_RUN.i === e.i) return {text: customerPacket(e, LAST_RUN.body, LAST_RUN.resp), live:true};
  return {text: customerPacket(e, bodyOf(e), {code:'—', json:null, pretty:''}), live:false};
}

function customerPacket(e, sentBody, resp){
  const url = baseUrl() + e.p + (e.t ? '?token=<YOUR_TOKEN>' : '');
  const tr = trimResponse(resp.json, resp.pretty);
  const body = redactToken(sentBody||'');
  return `Hi,

Below is the exact call, verified on our side on ${new Date().toISOString().slice(0,10)}.

ENDPOINT
${e.m||'POST'} ${url}

HEADERS
Content-Type: application/json
Accept: application/json

REQUEST BODY
${body}

RESPONSE  (${resp.code})
${resp.pretty ? redactToken(tr.text).slice(0,4000) : '(not captured yet — run the request in the tool to include the live response here)'}
${tr.trimmed ? `\n${tr.note}` : ''}

NOTES
- Get the token from POST ${baseUrl()}/auth/login with body {"data":{"username":"...","password":"..."}}. It is returned in data.token.
- The token is passed as a "token" query parameter, not in an Authorization header.
- Almost every endpoint uses POST, including reads, and the body is always wrapped in a "data" object.
- IMPORTANT: this API returns HTTP 200 even when a call fails. Read "status_code" and "message" from the response body rather than relying on the HTTP status.

Best regards,`;
}

function customerReply(e){
  const url = baseUrl() + e.p + (e.t ? '?token=<YOUR_TOKEN>' : '');
  const b = bodyOf(e);
  return `Hi,

To do this, use the following endpoint:

${e.m} ${url}
Content-Type: application/json
${e.t ? '\nAuthentication: pass the token you receive from POST /auth/login as a "token" query parameter.\n' : ''}${b ? `\nRequest body:\n${b}\n` : ''}
Notes:
- Almost all endpoints in this API use POST.
- The request body is always wrapped in a "data" object.
- List endpoints accept "limit" and "offset" inside "data" for paging, and a "filters" object for filtering.

Let me know if you need a sample response for this call.

Best regards,`;
}

            : noFix ? t('التصحيح التلقائي مقفول على الريكوستات اللي بتعدّل أو بتمسح','Auto-fix is disabled for requests that modify or delete')

/* ---------------- try it (live) ---------------- */
async function tryIt(e){
  const out = $('tryout'), btn=$('tryIt'), old=btn.textContent;
  btn.disabled=true; btn.textContent=t('بيبعت…','Sending…');
  try{ await tryItRun(e, out); } finally { btn.disabled=false; btn.textContent=old; }
}
/* ============ عرض الريكوست اللي اتبعت فعلاً ============
   لما بوستمان ينجح والأداة تفشل، الفرق بيبان من المقارنة الحرفية.
   كلمة السر بتتخفي، بس بنطلّع بصمتها عشان نمسك المشاكل الشائعة. */
function pwFingerprint(pw){
  if(pw==null) return null;
  const s2=String(pw), n=s2.length;
  const notes=[];
  if(s2!==s2.trim()) notes.push(t('فيه مسافة في الأول أو الآخر','has leading/trailing space'));
  if(/\s/.test(s2)) notes.push(t('فيه مسافة في النص','contains a space'));
  if(/[^\x20-\x7E]/.test(s2)) notes.push(t('فيه حروف مش إنجليزية','contains non-ASCII characters'));
  const cls=[];
  if(/[a-z]/.test(s2)) cls.push(t('صغير','lower'));
  if(/[A-Z]/.test(s2)) cls.push(t('كبير','upper'));
  if(/[0-9]/.test(s2)) cls.push(t('أرقام','digits'));
  if(/[^A-Za-z0-9]/.test(s2)) cls.push(t('رموز','symbols'));
  return {n, notes, cls};
}
function echoReq(method, url, headers, bodyStr){
  let shown = bodyStr || '', fp = null, uname = null;
  try{
    const o = JSON.parse(bodyStr||'{}');
    const d = o && o.data;
    if(d && typeof d==='object'){
      if('password' in d){ fp = pwFingerprint(d.password); }
      if('username' in d){ uname = String(d.username); }
      const masked = JSON.parse(JSON.stringify(o));
      if(masked.data && 'password' in masked.data) masked.data.password = '\u2022'.repeat(Math.min(fp?fp.n:8, 24));
      shown = JSON.stringify(masked, null, 4);
    }
  }catch(_){}
  const safeUrl = (url||'').split(SESSION.token||'\u0000').join('<YOUR_TOKEN>');
  const hdr = Object.entries(headers||{}).map(([k,v])=>`${k}: ${v}`).join('\n');
  let diag = '';
  if(uname!=null || fp){
    const bits=[];
    if(uname!=null) bits.push(`<tr><td style="font-family:var(--ar); color:var(--ink)">${t('اسم المستخدم اللي اتبعت','username sent')}</td>
      <td><code>${esc(uname)}</code> — ${uname.length} ${t('حرف','chars')}${uname!==uname.trim()?` <b style="color:var(--alert)">${t('فيه مسافة زيادة','has extra space')}</b>`:''}</td></tr>`);
    if(fp) bits.push(`<tr><td style="font-family:var(--ar); color:var(--ink)">${t('كلمة السر اللي اتبعتت','password sent')}</td>
      <td>${fp.n} ${t('حرف','chars')} · ${fp.cls.join(' + ')}${fp.notes.length?` · <b style="color:var(--alert)">${fp.notes.join('، ')}</b>`:` · <span style="color:var(--ok)">${t('نضيفة','clean')}</span>`}</td></tr>`);
    diag = `<table class="kv" style="margin-top:8px">${bits.join('')}</table>`;
  }
  const warn = /<USERNAME>|<PASSWORD>/.test(bodyStr||'')
    ? `<div class="note warn" style="margin-top:8px"><b>${t('دي علامات مش بيانات!','These are placeholders, not data!')}</b> ${t('الأداة بعتت الكلام ده حرفيًا. اتصل من الشريط اللي فوق وجرّب تاني.','The tool sent these literally. Connect from the top bar and run again.')}</div>` : '';
  return `<h3 style="margin:14px 0 6px; font-size:12px; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)">${t('الريكوست اللي اتبعت فعلاً','What was actually sent')}</h3>
    <pre class="pre">${esc(method+' '+safeUrl+'\n'+hdr+'\n\n'+shown)}</pre>${diag}${warn}`;
}

/* الكولكشن فيه <USERNAME>/<PASSWORD> لأننا شيلنا بيانات الاختبار — نحط بيانات الجلسة وقت التنفيذ */
function liveBody(e){
  const raw = bodyOf(e);
  if(!NO_RETRY.test(e.p||'') || !SESSION.user) return raw;
  try{
    const o = JSON.parse(raw);
    if(o && o.data && ('username' in o.data || 'password' in o.data)){
      if('username' in o.data) o.data.username = SESSION.user;
      if('password' in o.data) o.data.password = SESSION.pass;
      return JSON.stringify(o, null, 4);
    }
  }catch(_){}
  return raw;
}

async function tryItRun(e, out){
  if(e.t && !SESSION.token){
    out.innerHTML = `<div class="note warn" style="margin-top:12px">${t('مش متصل. اكتب اسم المستخدم وكلمة السر فوق واضغط اتصال، والأداة هتجيب التوكن لوحدها.','Not connected. Enter the username and password above and press Connect — the tool fetches the token for you.')}</div>`;
    return;
  }
  const b = liveBody(e);
  if(NO_RETRY.test(e.p||'') && !SESSION.user){
    out.innerHTML = `<div class="note warn" style="margin-top:12px">${t('البودي ده فيه علامات مكان البيانات مش بيانات حقيقية. اتصل من الشريط اللي فوق الأول.','This body carries placeholders, not real credentials. Connect from the top bar first.')}</div>`;
    return;
  }
  const myseq = ++RUN_SEQ;
  out.innerHTML = `<div class="note" style="margin-top:12px">${t('جاري الإرسال…','Sending…')}</div>`;
  const sentUrl = baseUrl() + e.p + (e.t ? ('?token=' + (SESSION.token||'')) : '');
  const sentHdr = {'Content-Type':'application/json','Accept':'application/json'};
  try{
    const r = await apiFetch(e.p, (b && e.m!=='GET') ? b : null,
                             {method:e.m||'POST', noToken:!e.t, noRetry:NO_RETRY.test(e.p||'')});
    if(myseq !== RUN_SEQ) return;          // رد متأخر لريكوست قديم — نتجاهله
    rememberRun(e, b, r);
    const hasTok = /"token"\s*:/.test(r.pretty||'');
    out.innerHTML =
      `<div class="note ${r.ok?'sig':'warn'}" style="margin-top:12px">${t('الرد','Response')}: <b>${r.code}</b>`
      + `${r.relogged?t(' — التوكن كان خلص واتجدّد لوحده',' — the token had expired and was refreshed'):''}`
      + `${r.ok?'':'<br>'+diagnose(r.code, r.txt)}</div>`
      + echoReq(e.m||'POST', sentUrl, sentHdr, b)
      + `<h3 style="margin:14px 0 6px; font-size:12px; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)">${t('الرد كامل','Full response')}</h3>`
      + (hasTok ? `<div class="note" style="margin-bottom:8px">${t('التوكن مخفي عشان لو صوّرت الشاشة وبعتها ما يخرجش. تقدر تشوفه أو تنسخه من فوق.','The token is hidden so a screenshot stays safe to send. You can reveal or copy it from the top bar.')}
           <button class="chip" id="tokShow" style="margin-inline-start:6px">${t('أظهر التوكن','Reveal token')}</button></div>` : '')
      + `<pre class="pre" id="respBox">${esc(redactToken(r.pretty).slice(0,4000))}</pre>`
      + `<div class="row">`
      +   (r.ok ? `<button class="btn sig" id="cpPacket">\u2709 ${t('انسخ رد كامل للعميل','Copy full reply for the customer')}</button>` : '')
      +   `<button class="btn ghost" id="cpSent">${t('نسخ اللي اتبعت كـ curl','Copy what was sent as curl')}</button>`
      +   (r.ok ? '' : `<button class="btn warn" id="cpEsc">${t('تصعيد','Escalate')}</button>`)
      + `</div>`;
    clipBlocks(out);
    if(hasTok && $('tokShow')) $('tokShow').onclick = ()=>{
      const box=$('respBox'), btn=$('tokShow'), shown = btn.dataset.on==='1';
      box.textContent = shown ? redactToken(r.pretty).slice(0,4000) : r.pretty.slice(0,4000);
      btn.dataset.on = shown ? '' : '1';
      btn.textContent = shown ? t('أظهر التوكن','Reveal token') : t('اخفي التوكن','Hide token');
    };
    if(r.ok && $('cpPacket')) $('cpPacket').onclick = ()=>{
      const pk = packetFor(e);
      copy(pk.text, t('اتنسخ الرد الكامل','Full reply copied'));
    };
    if($('cpSent')) $('cpSent').onclick = ()=>copy(
      `curl -X ${e.m||'POST'} "${sentUrl.split(SESSION.token||'\u0000').join('<YOUR_TOKEN>')}" \\\n  -H "Content-Type: application/json" \\\n  -H "Accept: application/json" \\\n  -d '${redactToken(b||'')}'`,
      t('اتنسخ','Copied'));
    if(!r.ok && $('cpEsc')) $('cpEsc').onclick = ()=>openEscalation(`${e.m} ${e.p}`);
  }catch(err){
    if(myseq !== RUN_SEQ) return;
    out.innerHTML = `<div class="note warn" style="margin-top:12px">
      <b>${t('الريكوست ما وصلش للسيرفر.','The request did not reach the server.')}</b><br>
      ${t('اتأكد من النت ومن عنوان البيئة، أو انسخ مثال cURL وشغّله من الترمنال.','Check the connection and the environment URL, or copy the cURL example and run it from a terminal.')}<br>
      <small>${esc(String(err).slice(0,180))}</small></div>`;
  }
}

$('mclose').onclick = ()=> $('mask').hidden = true;
$('mask').onclick = ev => { if(ev.target === $('mask')) $('mask').hidden = true; };
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape'){ $('mask').hidden = true; return; }
  /* التركيز يفضل جوه النافذة — من غير كده الـ Tab بيهرب للصفحة اللي ورا */
  if(ev.key==='Tab' && !$('mask').hidden){
    const f = $('mask').querySelectorAll('button, [href], input, select, textarea');
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(ev.shiftKey && document.activeElement===first){ ev.preventDefault(); last.focus(); }
    else if(!ev.shiftKey && document.activeElement===last){ ev.preventDefault(); first.focus(); }
    return;
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName||''));
  if(ev.key==='/' && !typing){ ev.preventDefault(); showView('search'); $('q').focus(); $('q').select(); return; }
  if(!typing || ev.target.id==='q'){
    const items=[...$('results').querySelectorAll('.res')];
    if(!items.length) return;
    const at=items.findIndex(b=>b.getAttribute('aria-current')==='true');
    if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){
      ev.preventDefault();
      const nx = ev.key==='ArrowDown' ? Math.min(at+1, items.length-1) : Math.max(at-1, 0);
      items[nx<0?0:nx].click(); items[nx<0?0:nx].scrollIntoView({block:'nearest'});
    }
  }
});

let tt;
function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1900); }
function copy(text, msg){
  navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy'); toast(msg);}catch(_){toast(t('انسخ يدويًا','Copy manually'));}
    ta.remove();
  });
}

   <p>لو العميل بيعتمد على كود الـ HTTP في معالجة الأخطاء، هيفتكر كل حاجة ناجحة. لازم يقرا <code>status_code</code> و<code>message</code> من البودي.</p>
   <div class="note sig" style="margin-top:8px">دي أهم معلومة تتقال لأي عميل قبل ما يبدأ الإنتجريشن.</div>`,
     en:`<p>The platform returns <code>HTTP 200 OK</code> even when a call fails. The real outcome sits inside the body:</p>
   <pre class="pre">{
    "message": "invalid_credentials",
    "status_code": 401,
    "extra": []
}</pre>
   <p>A customer relying on the HTTP status will treat every call as successful. They must read <code>status_code</code> and <code>message</code> from the body.</p>
   <div class="note sig" style="margin-top:8px">Tell every customer this before they start integrating.</div>`}},

function renderErrors(){
  return ERRORS.map(e=>`<div class="card" style="grid-column:1/-1; border-color:#E3C3A6">
    <h3><code>${esc(e.code)}</code> <span class="tagv">${t('من حالة حقيقية','from a real case')}</span></h3>
    <p><b>HTTP:</b> ${esc(e.http)} &nbsp;·&nbsp; <b>${t('اتشافت في','seen in')}:</b> ${esc(dual(e.seen))}</p>
    <p><b>${t('معناها','Meaning')}:</b> ${esc(dual(e.meaning))}</p>
    <p><b>${t('افحص بالترتيب','Check in this order')}:</b></p>
    <ol style="margin:0; padding-inline-start:20px; font-size:13.5px; color:var(--ink-2)">
      ${dual(e.checks).map(c=>`<li style="margin-bottom:4px">${esc(c)}</li>`).join('')}</ol>
    ${e.note ? `<div class="note" style="margin-top:10px">${esc(dual(e.note))}</div>`:''}
  </div>`).join('');
}

 { sev:'high', src:{ar:'من الكولكشن — units/add و units/edit', en:'From the collection — units/add and units/edit'},
   t:{ar:'أربع أرقام للعربية الواحدة — وكلهم بيتلخبطوا', en:'Four different numbers per vehicle — and they get mixed up'},
   body:{ar:`<p>العربية الواحدة في النظام ليها أربع أرقام مختلفة تمامًا:</p>
   <table class="kv">
     <tr><td><code>id</code> = <b>UID</b></td><td><b>رقم العربية جوه أفاقي.</b> شكله <code>5fb0e2e703ed529bb30f9af3</code>. ده اللي الـ API بيشتغل بيه في كل الريكوستات. الحقل في الرد اسمه <code>id</code> وإحنا بنسميه الـ UID.</td></tr>
     <tr><td><code>imei</code></td><td><b>رقم الجهاز نفسه.</b> 15 رقم زي <code>357454075086551</code>. ده اللي الفني بيقراه من التراكر، وده اللي العميل غالبًا هيبعتهولك.</td></tr>
     <tr><td><code>device_serial</code></td><td><b>سيريال الجهاز.</b> رقم تاني خالص زي <code>861230048816917</code> — مش نفس الـ IMEI.</td></tr>
     <tr><td><code>sim_serial</code></td><td><b>سيريال الشريحة.</b> بتاع شركة الاتصالات، ملهوش علاقة بالجهاز.</td></tr>
   </table>
   <p style="margin-top:8px"><b>اللخبطة اللي بتحصل:</b> العميل بيقول «الجهاز 357454075086551 مش بيرسل» — ده IMEI. والـ API عايز الـ <code>id</code>. لازم تحوّل الأول.</p>
   <div class="note sig" style="margin-top:8px">السيناريوهات في التول بتقبل أي رقم من الأربعة وبتحوّل لوحدها، وبتقولك اتطابقت على أنهي واحد.</div>`,
     en:`<p>A single vehicle carries four completely different numbers:</p>
   <table class="kv">
     <tr><td><code>id</code> = <b>UID</b></td><td><b>The vehicle number inside Afaqy.</b> Looks like <code>5fb0e2e703ed529bb30f9af3</code>. Every API request uses it. The field is called <code>id</code> in responses; we call it the UID.</td></tr>
     <tr><td><code>imei</code></td><td><b>The tracker hardware identity.</b> 15 digits, e.g. <code>357454075086551</code>. This is what a field technician reads off the device, and what a customer will usually send you.</td></tr>
     <tr><td><code>device_serial</code></td><td><b>The device serial.</b> A different number again, e.g. <code>861230048816917</code> — not the IMEI.</td></tr>
     <tr><td><code>sim_serial</code></td><td><b>The SIM serial.</b> Belongs to the carrier, unrelated to the device.</td></tr>
   </table>
   <p style="margin-top:8px"><b>Where it goes wrong:</b> the customer says "device 357454075086551 is not reporting" — that is an IMEI. The API wants the <code>id</code>. You have to convert first.</p>
   <div class="note sig" style="margin-top:8px">The scenarios in this tool accept any of the four and convert for you, and tell you which one matched.</div>`}},

 { sev:'mid', src:{ar:'عميل ج — يونيو 2026', en:'Customer C — June 2026'},

   </ul><p style="margin-top:8px">Say this upfront rather than letting the customer find it after go-live.</p>`}},

 { sev:'ok', src:{ar:'المدير التقني — يونيو 2026', en:'Technical manager — June 2026'},

   body:{ar:`<p>القاعدة اللي الفريق التقني ماشي عليها في أي شكوى إنتجريشن:</p>
   <p><b>اطلب من العميل الـ curl كامل، و UID عربية واحدة.</b></p>

     en:`<p>The rule the technical team applies to every integration complaint:</p>

function wireAdder(){

  g.onclick = ()=>{

                   body:{ar:'<p>'+esc(B).replace(/\n/g,'<br>')+'</p>', en:'<p>'+esc(B).replace(/\n/g,'<br>')+'</p>'} };
    ADDED.push(item); LEARNED.push(item);

  };

    if(!ADDED.length){ toast(t('مفيش حاجة مضافة','Nothing added yet')); return; }
    const blob = new Blob([JSON.stringify(ADDED,null,2)], {type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='afaqy-knowledge.json'; a.click();
  };
  $('adImp').onchange = ev=>{
    const f=ev.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const arr=JSON.parse(rd.result);
      if(!Array.isArray(arr)) throw 0;
      /* الملف ممكن ييجي من أي حد — بنشيل أي وسوم قبل ما نعرضه */
      const clean = v => typeof v==='string' ? esc(v).replace(/&lt;br&gt;/g,'<br>') : v;
      const safe = x => ({
        sev: (x && x.sev==='high') ? 'high' : (x && x.sev==='mid' ? 'mid' : 'ok'),
        t:   {ar: clean((x.t||{}).ar||''), en: clean((x.t||{}).en||(x.t||{}).ar||'')},
        src: {ar: clean((x.src||{}).ar||''), en: clean((x.src||{}).en||(x.src||{}).ar||'')},
        body:{ar: '<p>'+clean((x.body||{}).ar||'')+'</p>', en: '<p>'+clean((x.body||{}).en||(x.body||{}).ar||'')+'</p>'}
      });
      arr.filter(x=>x && x.t).map(safe).forEach(x=>{ LEARNED.push(x); ADDED.push(x); });
      toast(t('اتضافت '+arr.length, arr.length+' imported')); renderFaq();

    rd.readAsText(f);
  };

/* قراءة قيمة من رد غير معروف الشكل: بندوّر بالعمق بدل ما نفترض */
function deepFindKey(obj, key, depth){
  depth = depth||0; if(obj==null || depth>8) return null;
  if(Array.isArray(obj)){ for(const x of obj){ const r=deepFindKey(x,key,depth+1); if(r!=null) return r; } return null; }
  if(typeof obj==='object'){
    if(obj[key]!=null && typeof obj[key]!=='object') return obj[key];
    for(const k of Object.keys(obj)){ const r=deepFindKey(obj[k],key,depth+1); if(r!=null) return r; }
  }
  return null;
}
/* بندوّر على كائن كامل بالاسم بتاعه */
function deepFindObj(o, key, depth){
  depth=depth||0; if(o==null||depth>8) return null;
  if(Array.isArray(o)){ for(const x of o){ const r=deepFindObj(x,key,depth+1); if(r) return r; } return null; }
  if(typeof o==='object'){
    if(o[key] && typeof o[key]==='object' && !Array.isArray(o[key])) return o[key];
    for(const k of Object.keys(o)){ const r=deepFindObj(o[k],key,depth+1); if(r) return r; }
  }
  return null;
}

/* كل الكائنات اللي شبه السجلات: عندها معرّف واسم */
function deepItems(obj, out, depth){
  out=out||[]; depth=depth||0; if(obj==null || depth>8 || out.length>4000) return out;
  if(Array.isArray(obj)){ obj.forEach(x=>deepItems(x,out,depth+1)); return out; }
  if(typeof obj==='object'){
    const id = obj.id || obj._id, nm = obj.name || obj.title || obj.username || obj.label;
    if(id && typeof id!=='object' && nm && typeof nm==='string') out.push({
      id:String(id), name:nm, raw:obj,
      imei: obj.imei!=null ? String(obj.imei) : null,
      serial: obj.device_serial!=null ? String(obj.device_serial) : null,
      plate: obj.plate_number || obj.plate || null });
    Object.keys(obj).forEach(k=>deepItems(obj[k],out,depth+1));
  }
  return out;
}
/* العميل ممكن يبعتلك أي رقم من أرقام العربية — نطابق عليهم كلهم */
function matchByName(resp, needle){
  const items = deepItems(resp); const n = norm(needle); const raw=(needle||'').trim();
  if(!items.length) return {items:[], hit:null, by:null, hasImei:false};
  const hasImei = items.some(x=>x.imei);
  const tries = [
    ['ID',            x=>x.id===raw],
    ['IMEI',          x=>x.imei && x.imei===raw],
    ['device_serial', x=>x.serial && x.serial===raw],
    ['plate',         x=>x.plate && norm(x.plate)===n],
    ['name',          x=>norm(x.name)===n],
    ['name',          x=>norm(x.name).includes(n)],
    ['name',          x=>n.includes(norm(x.name))]
  ];
  for(const [by,fn] of tries){ const hit=items.find(fn); if(hit) return {items, hit, by, hasImei}; }
  return {items, hit:null, by:null, hasImei};
}
function monthRange(ym){                       // "2026-07" → أول وآخر لحظة في الشهر
  const [y,m]=ym.split('-').map(Number);
  const last=new Date(y, m, 0).getDate();
  const p=n=>String(n).padStart(2,'0');
  return {from:`${y}-${p(m)}-01 00:00:00`, to:`${y}-${p(m)}-${p(last)} 23:59:59`};
}
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayRange(d){ return {from:(d||today())+' 00:00:00', to:(d||today())+' 23:59:59'}; }
/* أكبر مصفوفة سجلات في الرد = عدد الإشارات، من غير ما نفترض شكل الرد */
function countRows(o, depth){ depth=depth||0; if(o==null||depth>7) return 0;
  let best=0;
  if(Array.isArray(o)){ if(o.length && typeof o[0]==='object') best=o.length; o.forEach(x=>{best=Math.max(best,countRows(x,depth+1));}); return best; }
  if(typeof o==='object') Object.keys(o).forEach(k=>{ best=Math.max(best,countRows(o[k],depth+1)); });
  return best;
}
/* استخراج أجهزة المجموعة مهما كان شكلها */
function groupUnitIds(raw){
  const list = raw && (raw.unitsList || raw.units || raw.ids || raw.unit_ids);
  const out=[];
  if(Array.isArray(list)) list.forEach(x=>{
    if(typeof x==='string') out.push({id:x, name:x});
    else if(x && (x.id||x._id)) out.push({id:String(x.id||x._id), name:x.name||String(x.id||x._id)});
  });
  if(!out.length && raw){ deepItems(raw).forEach(x=>out.push({id:x.id,name:x.name})); }
  return out;
}
function prevMonth(){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
