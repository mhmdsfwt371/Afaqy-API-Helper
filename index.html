let RC = null;   // {r, vars, results[], idx}

function renderRecipeCards(){
  $('rcCards').innerHTML = RECIPES.map(r=>`<div class="card">
    <h3>${r.icon} ${esc(dual(r.title))}</h3><p>${esc(dual(r.desc))}</p>
    <div class="row"><button class="btn sig" data-r="${r.id}">${t('ابدأ','Start')}</button>
    <span class="chip" style="pointer-events:none">${r.steps.length} ${t('خطوات','steps')}</span></div></div>`).join('');
  $('rcCards').querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>startRecipe(b.dataset.r));
}
function startRecipe(id){
  const r = RECIPES.find(x=>x.id===id);
  RC = {r, vars:{}, results:r.steps.map(()=>null), idx:0};
  if(SESSION.token || TOKEN_MEM) RC.vars.token = SESSION.token || TOKEN_MEM;
  $('rcHome').hidden = true; $('rcRun').hidden = false; renderRecipe();
}
function backHome(){ $('rcHome').hidden=false; $('rcRun').hidden=true; RC=null; }

function stepUrl(st){ return baseUrl() + st.path + (st.auth===false ? '' : '?token=' + (SESSION.token || RC.vars.token || '<TOKEN>')); }
function stepBodyRaw(st){ try{ return JSON.stringify(st.body(RC.vars)); }catch(e){ return '{}'; } }
function stepBody(st){ try{
    return JSON.stringify(st.body(RC.vars), null, 2)
      .replace(/("password"\s*:\s*")[^"]*(")/g, '$1••••••••$2');   // ما نعرضش كلمة السر
  }catch(e){ return '{}'; } }

function renderRecipe(){
  const r = RC.r;
  $('rcRun').innerHTML = `
  <div class="row" style="margin-bottom:12px"><button class="btn ghost" id="rcBack">${t('‹ كل السيناريوهات','‹ All scenarios')}</button></div>
  <div class="panel">
    <div class="p-head"><div class="crumb">${t('سيناريو','Scenario')}</div><div class="path" style="font-family:var(--ar)">${esc(dual(r.title))}</div>
      <p style="margin:6px 0 0; color:var(--muted); font-size:13.5px">${esc(dual(r.desc))}</p></div>
    ${r.inputs.length ? `<div class="sec"><h3>${t('المدخلات','Inputs')}</h3>
      <table class="kv">${r.inputs.map(f=>`<tr><td style="font-family:var(--ar); color:var(--ink)">${esc(dual(f.l))}</td>
      <td><input id="in_${f.k}" type="${f.t==='month'?'month':f.t}" value="${f.t==='month'?prevMonth():(f.t==='date'?today():'')}"
        style="width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:3px; font-family:${f.t==='month'?'var(--mono)':'inherit'}"></td></tr>`).join('')}</table>

      </div>`:''}
    <div class="sec"><h3>${t('الخطوات','Steps')}</h3><div id="rcSteps"></div></div>
    <div class="sec"><div class="row">
      <button class="btn sig" id="rcAll">${t('شغّل كل الخطوات','Run all steps')}</button>
      <button class="btn ghost" id="rcCurl">${t('نسخ السلسلة كاملة','Copy full chain')}</button>
      <button class="btn warn" id="rcEsc">${t('تصعيد لمصر','Escalate')}</button>
    </div></div>
  </div>`;
  $('rcBack').onclick = backHome;
  r.inputs.forEach(f=>{ const el=$('in_'+f.k); if(RC.vars[f.k]) el.value=RC.vars[f.k];
    el.oninput=()=>{ RC.vars[f.k]=el.value; renderSteps(); }; RC.vars[f.k]=el.value; });
  $('rcCurl').onclick = ()=>openModal(t('السلسلة كاملة','Full chain'), r.steps.map((st,i)=>
    st.kind!=='call' ? `# ${i+1}: ${dual(st.t)} (${t('بتتم داخل التول','handled inside the tool')})` :
    `# ${i+1}: ${dual(st.t)}\ncurl -X ${st.m} "${stepUrl(st)}" \\\n  -H "Content-Type: application/json" \\\n  -d '${stepBody(st)}'`).join('\n\n'), false);
  $('rcEsc').onclick = ()=>openEscalation(dual(r.title));
  $('rcAll').onclick = async ()=>{
    const b=$('rcAll'), old=b.textContent; b.disabled=true;
    for(let i=0;i<r.steps.length;i++){
      const st=r.steps[i];
      if(st.kind==='choose'){ b.disabled=false; b.textContent=old;
        toast(t('وقفت عند خطوة الاختيار — اختار وكمّل','Stopped at a choice step — pick one and continue')); return; }
      b.textContent = t(`الخطوة ${i+1} من ${r.steps.length}…`,`Step ${i+1} of ${r.steps.length}…`);
      await runStep(i);
      if(!RC.results[i] || !RC.results[i].ok){ b.disabled=false; b.textContent=old;
        toast(t('وقفت عند خطوة فشلت','Stopped at a failed step')); return; }
    }
    b.disabled=false; b.textContent=old; toast(t('خلصت كل الخطوات','All steps completed'));
  };
  renderSteps();
}

function renderSteps(){
  const r = RC.r;
  $('rcSteps').innerHTML = r.steps.map((st,i)=>{
    const done = RC.results[i], locked = i>0 && !RC.results[i-1];
    const state = done ? (done.ok?t('تمام','OK'):t('فشل','failed')) : (locked?t('مقفولة','locked'):t('جاهزة','ready'));
    const color = done ? (done.ok?'var(--ok)':'var(--alert)') : 'var(--muted)';
    return `<div class="panel" style="margin-bottom:8px; border-color:${done&&!done.ok?'#E3C3A6':'var(--line-soft)'}">
      <div style="padding:11px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap">
        <b style="font-size:14px">${i+1}. ${esc(dual(st.t))}</b>
        <span style="font-family:var(--mono); font-size:11.5px; color:${color}">${state}</span>
      </div>
      ${st.kind==='call' ? `<div style="padding:0 14px 12px">
        <pre class="pre">${esc(st.m+' '+stepUrl(st))}\n\n${esc(stepBody(st))}</pre></div>`:''}
      ${st.kind==='loop' ? `<div style="padding:0 14px 12px">
        <pre class="pre">${esc(st.m+' '+baseUrl()+st.path+'?token=…')}\n${esc('ريكوست مستقل لكل جهاز في المجموعة')}</pre></div>`:''}
      ${st.hint ? `<div style="padding:0 14px 12px"><div class="note">${esc(dual(st.hint))}</div></div>`:''}
      <div style="padding:0 14px 14px" class="row">
        ${locked ? '' : `<button class="btn sig" data-run="${i}">${st.kind==='call'?t('شغّل الخطوة','Run step'):t('نفّذ','Run')}</button>`}
        ${st.kind==='call' && !locked ? `<button class="btn ghost" data-paste="${i}">${t('الصق الرد يدويًا','Paste response')}</button>`:''}
      </div>
      <div id="out_${i}" style="padding:0 14px 14px"></div>
    </div>`;
  }).join('');
  $('rcSteps').querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>runStep(+b.dataset.run));
  $('rcSteps').querySelectorAll('[data-paste]').forEach(b=>b.onclick=()=>pasteStep(+b.dataset.paste));
  RC.results.forEach((res,i)=>{ if(res) paintStep(i,res); });
}

function paintStep(i,res){
  const box = $('out_'+i); if(!box) return;
  const st = RC.r.steps[i];
  let extra = '';
  if(res.vars && Object.keys(res.vars).length) extra = `<div class="why" style="margin-top:8px"><b>${t('اتاخد من الخطوة دي:','Captured from this step:')}</b>
    ${Object.entries(res.vars).map(([k,v])=>`<span>${esc(k)} = ${esc(String(v).slice(0,34))}</span>`).join('')}</div>`;
  box.innerHTML = `<div class="note ${res.ok?'sig':'warn'}">${res.msg}</div>
    ${res.html || ''}
    ${res.text ? `<pre class="pre" style="margin-top:8px">${esc(res.text.slice(0,2600))}</pre>`:''}
    ${res.picker || ''}${extra}`;
  if(res.pickerWire) res.pickerWire();
  box.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copy(b.dataset.cp, t('اتنسخ','Copied')));
}

/* طبيب الأخطاء — يترجم الرد لسبب بالعربي */
/* الأولوية للي السيرفر قاله فعلًا. الأكواد الرقمية هنا مش قياسية —
   شفنا 405 معناها خطأ بيانات مش ميثود غلط — فما نفتيش منها. */
const FIELD_AR = {unit_id:'رقم العربية', ids:'أرقام العربيات', id:'الرقم', user_id:'رقم المستخدم',
  username:'اسم المستخدم', password:'كلمة السر', date:'الفترة', from:'تاريخ البداية', to:'تاريخ النهاية',
  limit:'الحد', offset:'نقطة البداية', code:'كود التقرير', fields:'أعمدة التقرير', resources:'العربيات المختارة'};
const REASON = {
  not_found:      {ar:'مش موجود في الحساب ده', en:'not found on this account'},
  invalid_resource:{ar:'مش من نوع الحاجة المطلوبة', en:'not a valid resource of this type'},
  required:       {ar:'مطلوب وناقص', en:'required and missing'},
  invalid:        {ar:'شكله غلط', en:'malformed'},
  invalid_format: {ar:'الفورمات غلط', en:'wrong format'},
  unauthorized:   {ar:'مالكش صلاحية عليه', en:'not permitted'}
};

function diagnose(status, txt){
  const en = LANG==='en';
  let j2=null; try{ j2=JSON.parse(txt||'{}'); }catch(_){}
  const msg = (j2 && (j2.message||j2.error)) ? String(j2.message||j2.error) : '';
  const errs = j2 && j2.errors && typeof j2.errors==='object' ? j2.errors : null;

  /* أ) لو السيرفر حدد الحقول الغلط، ده أدق كلام ممكن نقوله */
  if(errs && Object.keys(errs).length){
    const rows = Object.entries(errs).map(([k,v])=>{
      const why = (Array.isArray(v)?v:[v]).map(x=>{
        const r=REASON[String(x)]; return r ? (en?r.en:r.ar) : String(x);
      }).join('، ');
      const name = en ? k : (FIELD_AR[k] ? `${FIELD_AR[k]} (<code>${esc(k)}</code>)` : `<code>${esc(k)}</code>`);
      return `<li>${name} — ${esc(why)}</li>`;
    }).join('');
    let hint='';
    const unitBad = Object.keys(errs).some(k=>/^(unit_id|ids|resources)$/.test(k));
    if(unitBad && !SESSION.unit)
      hint = `<br><b>${en?'The most likely cause:':'السبب الأرجح:'}</b> ${en
        ? 'the body still carries the sample id from the collection. Set a vehicle by IMEI in the top bar and run again.'
        : 'البودي لسه فيه رقم العينة بتاع الكولكشن. حدّد عربية بالـ IMEI من الشريط اللي فوق وجرّب تاني.'}`;
    else if(unitBad)
      hint = `<br><b>${en?'Check:':'اتأكد:'}</b> ${en
        ? 'the vehicle you set may not belong to this account, or the account cannot see it.'
        : 'العربية اللي حددتها ممكن ما تكونش في الحساب ده، أو الحساب مش شايفها.'}`;
    return `<b>${en?'The server rejected these fields:':'السيرفر رفض الحقول دي:'}</b>
      <ul style="margin:6px 0 0; padding-inline-start:20px">${rows}</ul>${hint}`;
  }

  /* ب) رسايل معروفة بالاسم */
  const t2 = (msg || txt || '').toLowerCase();
  if(t2.includes('invalid_credentials'))
    return en ? 'The account or the password — not the request shape. If the body is wrapped in <code>data</code> correctly, the request is fine: check the account is on this server, its role has access, and the password has not expired.'
              : 'الحساب أو كلمة السر — مش شكل الريكوست. لو البودي متغلّف في <code>data</code> صح، يبقى الريكوست سليم: اتأكد إن الحساب على السيرفر ده، وإن الرول ليها صلاحية، وإن كلمة السر مش منتهية.';
  if(t2.includes('expired') && t2.includes('password'))
    return en ? 'The password has expired. Use <code>/auth/reset_expired_password</code>.'
              : 'كلمة السر منتهية. استخدم <code>/auth/reset_expired_password</code>.';
  if(t2.includes('otp'))
    return en ? 'Two-factor is enabled: <code>/auth/send_login_otp</code> then <code>/auth/verify_login_otp</code>.'
              : 'الحساب عليه تحقق بخطوتين: <code>/auth/send_login_otp</code> وبعدها <code>/auth/verify_login_otp</code>.';
  if(t2.includes('validation_error'))
    return en ? 'The server rejected the data in the body, but did not say which field. Send the full response when escalating.'
              : 'السيرفر رفض بيانات البودي بس ما حددش أنهي حقل. ابعت الرد كامل مع التصعيد.';
  if(t2.includes('unauthenticated') || t2.includes('invalid_token') || t2.includes('token'))
    return en ? 'The token is missing, expired, or not accepted. Reconnect from the top bar.'
              : 'التوكن ناقص أو منتهي أو مرفوض. اتصل تاني من الشريط اللي فوق.';

  /* ج) آخر حاجة: الكود الرقمي، وبتحذير إنه مش قياسي هنا */
  const code = (j2 && (j2.status_code || (j2.data && j2.data.status_code))) || status;
  if(code===401 || code===403)
    return en ? 'Not authorised: the token or the role. Reconnect, and if it persists this is a permissions issue.'
              : 'مش مصرّح: التوكن أو صلاحية الرول. اتصل تاني، ولو فضلت تبقى مشكلة صلاحيات.';
  if(code===404)
    return en ? 'The endpoint was not found. Verify it in the Requests tab — some folders in the collection are copies with stale paths.'
              : 'الإندبوينت مش موجود. اتأكد منه من تبويب الريكوستات — في فولدرات في الكولكشن منسوخة وإندبوينتساتها قديمة.';
  if(code>=500)
    return en ? 'A server-side error. Escalate with the full response.'
              : 'خطأ من السيرفر نفسه. صعّدها بالرد كامل.';
  return en ? `The server returned ${code} with no field details. Note: the status codes on this platform are not standard — read "message" and "errors" rather than the number.`
            : `السيرفر رجّع ${code} من غير تفاصيل حقول. خد بالك إن الأكواد الرقمية هنا مش قياسية — اقرا <code>message</code> و<code>errors</code> مش الرقم.`;
}

async function runStep(i){
  const st = RC.r.steps[i];
  if(st.kind==='pick') return doPick(i);
  if(st.kind==='choose') return doChoose(i);
  if(st.kind==='loop') return runLoop(i);
  if(st.kind==='counters') return doCounters(i);
  if(st.kind==='uid') return doUid(i);
  if(st.kind==='speednow') return doSpeedNow(i);
  if(st.kind==='speedstats') return doSpeedStats(i);
  const box=$('out_'+i);
  if(st.auth!==false && !SESSION.token){
    RC.results[i]={ok:false, msg:t('مش متصل. اكتب اسم المستخدم وكلمة السر فوق واضغط اتصال.','Not connected. Enter the username and password above and press Connect.')}; return renderSteps();
  }
  box.innerHTML=`<div class="note">${t('جاري الإرسال…','Sending…')}</div>`;
  try{
    const r = await apiFetch(st.path, stepBodyRaw(st), {method:st.m, noToken: st.auth===false, noRetry: st.auth===false});
    finishCall(i, r.ok, r.code, r.json, r.pretty, r.ok?null:diagnose(r.code, r.txt), r.relogged);
  }catch(err){
    RC.results[i]={ok:false, msg:`<b>المتصفح ما قدرش يوصل للسيرفر.</b><br>ده غالبًا حظر <span class="lat">CORS</span> — مش معناه إن الريكوست غلط. استضيف الصفحة على نفس دومين الـ API، أو اضغط «الصق الرد يدويًا» وكمّل السلسلة عادي.`};
    renderSteps();
  }
}
/* بندوّر على السرعة مهما كان شكل الرد */
function collectSpeeds(o, out, depth){
  out=out||[]; depth=depth||0; if(o==null||depth>9||out.length>20000) return out;
  if(Array.isArray(o)){ o.forEach(x=>collectSpeeds(x,out,depth+1)); return out; }
  if(typeof o==='object'){
    for(const [k,v] of Object.entries(o)){
      if(/^speed$/i.test(k) && (typeof v==='number' || (typeof v==='string' && v!=='' && !isNaN(Number(v))))) out.push(Number(v));
      else collectSpeeds(v,out,depth+1);
    }
  }
  return out;
}
function speedCard(rows, note){
  return `<table class="kv" style="margin-top:10px">${rows.map(([k,v])=>
    `<tr><td style="font-family:var(--ar); color:var(--ink)">${k}</td><td>${v}</td></tr>`).join('')}</table>
    ${note?`<div class="note" style="margin-top:8px">${note}</div>`:''}`;
}
function doSpeedNow(i){
  const u = RC.vars._pickedRaw;
  if(!u){ RC.results[i]={ok:false,msg:t('محتاج تحدد العربية الأول.','Match the vehicle first.')}; return renderSteps(); }
  const sp = collectSpeeds(u);
  if(!sp.length){
    RC.results[i]={ok:false, msg:t('آخر تحديث ما فيهوش حقل سرعة. يا الجهاز ما رسلش، يا الحقل اسمه حاجة تانية — كمّل للخطوة اللي بعدها وشوف الإشارات.',
      'The last update carries no speed field. Either the device has not reported, or the field is named differently — continue to the next step and check the signals.')};
    return renderSteps();
  }
  const now = sp[0];
  RC.results[i]={ok:true,
    msg:`${t('آخر سرعة مسجّلة','Last recorded speed')}: <b style="font-size:17px; color:var(--signal-deep)">${now}</b> ${t('كم/س','km/h')}`,
    html: speedCard([[t('العربية','Vehicle'), esc(RC.vars.unitLabel||'—')],
                     [t('آخر قراءة','Last reading'), `<b>${now}</b> ${t('كم/س','km/h')}`]],
      now===0 ? t('صفر يعني واقفة دلوقتي — مش يعني الجهاز عطلان.','Zero means it is stationary right now — not that the device is faulty.') : '')};

}
function doSpeedStats(i){
  const prev = RC.results[i-1];
  if(!prev||!prev.json){ RC.results[i]={ok:false,msg:t('محتاج رد الخطوة اللي قبلها الأول.','The previous step must run first.')}; return renderSteps(); }
  const sp = collectSpeeds(prev.json);
  if(!sp.length){
    RC.results[i]={ok:false, msg:t('مفيش حقل سرعة في الرد. لو الرد نفسه فاضي يبقى الجهاز ما رسلش في الفترة دي — وده رد نهائي للعميل. لو الرد فيه نقط بس من غير سرعة، صعّدها.',
      'No speed field in the response. If the response itself is empty then the device sent nothing in that window — a definitive answer for the customer. If there are points but no speed, escalate.')};
    return renderSteps();
  }
  const max = Math.max(...sp), avg = sp.reduce((a,b)=>a+b,0)/sp.length;
  const moving = sp.filter(x=>x>0).length;
  const avgMoving = moving ? sp.filter(x=>x>0).reduce((a,b)=>a+b,0)/moving : 0;
  const num = n => Number(n).toLocaleString('en-US',{maximumFractionDigits:1});
  RC.results[i]={ok:true,
    msg:`${t('أعلى سرعة','Top speed')}: <b style="font-size:17px; color:var(--signal-deep)">${num(max)}</b> ${t('كم/س','km/h')} — ${t('من','from')} ${sp.length} ${t('نقطة','points')}`,
    html: speedCard([
      [t('عدد النقط','Points'), `<b>${sp.length}</b>`],
      [t('أعلى سرعة','Top speed'), `<b>${num(max)}</b> ${t('كم/س','km/h')}`],
      [t('متوسط كل النقط','Average, all points'), `${num(avg)} ${t('كم/س','km/h')}`],
      [t('متوسط وهي ماشية','Average while moving'), `${num(avgMoving)} ${t('كم/س','km/h')}`],
      [t('نقط وهي واقفة','Stationary points'), `${sp.length-moving}`]],
      t('القيم زي ما رجعت من السيستم بالظبط، مفيش أي تحويل. الشاشة بتعرضها كم/س.',
        'Values exactly as returned by the platform, with no conversion. The dashboard displays them as km/h.'))};

function doCounters(i){

async function runLoop(i){
  const st = RC.r.steps[i], box = $('out_'+i);
  const list = RC.vars[st.over] || [];
  if(!list.length){ RC.results[i]={ok:false, msg:t('مفيش أجهزة في المجموعة دي — اختار مجموعة تانية أو صعّدها.','No devices in this group — pick another one or escalate.')}; return renderSteps(); }
  const cap = list.slice(0,25), rows = [];
  for(let n=0; n<cap.length; n++){
    box.innerHTML = `<div class="note">${t(`جاري الفحص… ${n+1} من ${cap.length}`,`Checking ${n+1} of ${cap.length}…`)}</div>`;
    const u = cap[n];
    try{
      const r = await apiFetch(st.path, st.body(RC.vars, u.id), {method:st.m});
      rows.push({name:u.name, ok:r.ok, n: r.ok?countRows(r.json):0,
                 msg: r.ok?'':((r.json&&r.json.message)||('حالة '+r.code))});
    }catch(err){ rows.push({name:u.name, ok:false, n:0, msg:'المتصفح ما وصلش للسيرفر'}); }
  }
  const live = rows.filter(r=>r.ok && r.n>0).length,
        silent = rows.filter(r=>r.ok && r.n===0).length,
        failed = rows.filter(r=>!r.ok).length;
  const html = `<table class="kv" style="margin-top:10px"><tr>
      <td style="font-family:var(--ar); color:var(--ink); font-weight:600">${t('الجهاز','Device')}</td>
      <td style="font-weight:600">${t('الحالة','Status')}</td></tr>` +
    rows.map(r=>`<tr><td style="font-family:var(--ar); color:var(--ink)">${esc(r.name)}</td>
      <td>${r.ok ? (r.n>0 ? t(`<span class="tagv">بيرسل — ${r.n} إشارة</span>`,`<span class="tagv">reporting — ${r.n} signals</span>`) : `<span class="tagu">${t('ساكت في الفترة دي','silent in this window')}</span>`)
                 : `<span class="tagu">${esc(r.msg)}</span>`}</td></tr>`).join('') + '</table>' +
    (list.length>cap.length ? `<div class="note" style="margin-top:8px">${t(`فحصنا أول ${cap.length} جهاز من ${list.length}.`,`Checked the first ${cap.length} of ${list.length} devices.`)}</div>` : '');
  RC.results[i] = { ok: failed===0,
    msg: t(`فحصنا ${rows.length} جهاز — <b>${live}</b> بيرسل، <b>${silent}</b> ساكت، <b>${failed}</b> فشل.`,`Checked ${rows.length} devices — <b>${live}</b> reporting, <b>${silent}</b> silent, <b>${failed}</b> failed.`),
    html };
  renderSteps();
}

function finishCall(i, ok, status, json, pretty, diag, relogged){
  const st = RC.r.steps[i];
  let vars = {};
  if(ok && st.extract){ try{ vars = st.extract(json)||{}; }catch(_){} }
  Object.entries(vars).forEach(([k,v])=>{ if(v!=null) RC.vars[k]=v; });
  if(vars.token) TOKEN_MEM = vars.token;
  RC.results[i] = { ok, msg: ok ? `${t('الرد','Response')}: <b>${status}</b> — ${t('تمام','OK')}.${relogged?t(' (التوكن كان خلص، اتجدّد لوحده)',' (token had expired and was refreshed automatically)'):''}` : `${t('الرد','Response')}: <b>${status||'—'}</b><br>${diag||''}`,
                    text: pretty, json, vars };
  renderSteps();
}

const DEP_CACHE = {};

async function fetchDepList(r){
  if(DEP_CACHE[r.key]) return DEP_CACHE[r.key];
  const res = await apiFetch(r.list.path, r.list.body, {method:'POST'});
  if(!res.ok) throw new Error(diagnose(res.code, res.txt));
  DEP_CACHE[r.key] = res.json;
  return res.json;
}

function depSteps(r){
  const en = LANG==='en';
  return (en ? [
    `Call ${r.list.path} with this body:`,
    JSON.stringify(r.list.body),
    `Find the ${r.label.en} by its name in the response.`,
    `Copy its "id" (or "_id") value.`,
    `Paste that value into the request you were about to run.`
  ] : [
    `نادِ ${r.list.path} بالبودي ده:`,
    JSON.stringify(r.list.body),
    `دوّر على ${r.label.ar} بالاسم في الرد.`,
    `انسخ قيمة "id" (أو "_id") بتاعته.`,
    `الصقها في الريكوست اللي كنت رايح تشغّله.`
  ]);
}

/* بيرجع true لو كل حاجة جاهزة، وبيفتح النافذة لو ناقص حاجة */
function ensureDeps(e, cont){
  const missing = missingDeps(e);
  if(!missing.length) return true;
  if(!SESSION.token){ toast(t('اتصل بحساب العميل من فوق الأول','Connect to the customer account first')); return false; }
  openDepsModal(e, missing, cont);
  return false;
}

function openDepsModal(e, missing, cont){
  const en = LANG==='en';
  $('mtitle').textContent = t('الريكوست ده محتاج حاجة قبله','This request needs something first');
  $('mbody').innerHTML = `
    <div class="note warn" style="margin-bottom:12px">
      <b>${esc(e.m+' '+e.p)}</b><br>
      ${t('السيستم بيشتغل بالأرقام، وانت شغال بالأسماء. اكتب الاسم وأنا أجيب الرقم — أو خدلك الخطوات وروح جيبه بنفسك.',
          'The platform works with ids and you work with names. Type the name and I will fetch the id — or take the steps and fetch it yourself.')}
    </div>
    ${missing.map((r,n)=>`
      <div class="panel" style="margin-bottom:10px" data-dep="${n}">
        <div class="sec" style="border-top:0">
          <h3 style="font-family:var(--ar); font-size:14px; letter-spacing:0; text-transform:none; color:var(--ink)">
            ${t('محتاج','Needs')}: ${esc(dual(r.label))}</h3>
          ${r.note?`<div class="note" style="margin-bottom:8px">${esc(dual(r.note))}</div>`:''}
          <input id="dep_${n}" placeholder="${esc(dual(r.ask))}"
                 style="width:100%; padding:9px; border:1px solid var(--line); border-radius:3px">
          <div class="row">
            <button class="btn sig" data-auto="${n}">${t('اجيبهولك أنا','Fetch it for me')}</button>
            <button class="btn ghost" data-manual="${n}">${t('وريني الخطوات','Show me the steps')}</button>
          </div>
          <div id="depOut_${n}"></div>
        </div>
      </div>`).join('')}
    <div class="row"><button class="btn ghost" id="depClose">${t('إغلاق','Close')}</button></div>`;
  $('mask').hidden = false;
  $('depClose').onclick = ()=>{ $('mask').hidden = true; };

  const done = ()=>{
    if(!missingDeps(e).length){
      $('mask').hidden = true;
      toast(t('كل حاجة جاهزة — بنشغّل','All set — running'));
      if(cur) renderDetail(cur, []);
      if(typeof cont==='function') cont();
    }
  };

  $('mbody').querySelectorAll('[data-auto]').forEach(b=>b.onclick=async ()=>{
    const n=+b.dataset.auto, r=missing[n], out=$('depOut_'+n);
    const key=($('dep_'+n).value||'').trim();
    if(!key){ out.innerHTML=`<div class="note warn" style="margin-top:8px">${t('اكتب الاسم الأول','Type the name first')}</div>`; return; }
    b.disabled=true; const old=b.textContent; b.textContent=t('بيدوّر…','Looking…');
    out.innerHTML=`<div class="note" style="margin-top:8px">${t('بنجيب اللستة ونطابق…','Fetching the list and matching…')}</div>`;
    try{
      const list = await fetchDepList(r);
      const {hit, items, by} = matchByName(list, key);
      if(!hit){
        const near = items.slice(0,200);
        out.innerHTML = `<div class="note warn" style="margin-top:8px">
          ${t(`ما لقيناش «${esc(key)}» بين ${items.length}. اختار من اللستة:`,`No match for "${esc(key)}" among ${items.length}. Pick one:`)}</div>
          <select id="depSel_${n}" style="width:100%; margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:3px">

            ${near.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>`;
        const sel=$('depSel_'+n);
        if(sel) sel.onchange=()=>{ if(!sel.value) return;
          const it=near.find(x=>x.id===sel.value);
          setDep(r, {id:it.id, name:it.name, imei:it.imei, serial:it.serial, plate:it.plate, by:'list'});
          out.innerHTML = `<div class="note sig" style="margin-top:8px">${esc(dual(r.label))}: <b>${esc(it.name)}</b> — <code>${esc(it.id)}</code></div>`;
          done(); };

        setDep(r, {id:hit.id, name:hit.name, imei:hit.imei, serial:hit.serial, plate:hit.plate, by});
        out.innerHTML = `<div class="note sig" style="margin-top:8px">
          ${esc(dual(r.label))}: <b>${esc(hit.name)}</b><br>

    }finally{ b.disabled=false; b.textContent=old; }
  });

  $('mbody').querySelectorAll('[data-manual]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.manual, r=missing[n];
    $('depOut_'+n).innerHTML = `<div class="note" style="margin-top:8px">
      <b>${t('الخطوات','The steps')}:</b>

/* ================= الجلسة: التوكن بيتجاب لوحده ================= */
const SESSION = { user:'', pass:'', token:'', at:null, unit:null };
let UNITS_CACHE = null;          // لستة العربيات بتتجاب مرة واحدة في الجلسة

function unitPaint(msg, bad){
  /* خانة العربية مالهاش لازمة قبل الاتصال — بنخفيها عشان الشريط ما يبقاش مزدحم */
  const on = !!SESSION.token;
  ['unitSep','unitIn','unitGo','unitState'].forEach(id=>{ const x=$(id); if(x) x.hidden = !on; });
  const el=$('unitState'); if(!el) return;
  el.textContent = msg;
  el.className = 'pill' + (SESSION.unit ? ' on' : (bad ? ' bad' : ''));
}

/* بنجيب اللستة مرة واحدة، وبعدين أي رقم يتحوّل لـ UID فورًا */
async function resolveUnit(key){
  key=(key||'').trim();
  if(!key){ SESSION.unit=null; unitPaint(t('مفيش عربية محددة','no vehicle set')); refreshAfterUnit(); return; }
  if(!SESSION.token){ unitPaint(t('اتصل الأول','connect first'), true); return; }
  unitPaint(t('بيدوّر…','resolving…'));
  try{
    if(!UNITS_CACHE){
      const r = await apiFetch('/units/lists', {data:{offset:0,limit:1000,simplify:0,projection:['basic']}}, {method:'POST'});
      if(!r.ok){ unitPaint(t('ما قدرناش نجيب اللستة','could not fetch list'), true); return; }
      UNITS_CACHE = r.json;
    }
    const {hit, items, by, hasImei} = matchByName(UNITS_CACHE, key);
    if(!hit){
      SESSION.unit=null;
      unitPaint(hasImei ? t('مش موجود في الحساب','not on this account') : t('الرد مفيهوش IMEI','no IMEI in response'), true);
      toast(hasImei ? t(`ما لقيناش الرقم ده بين ${items.length} عربية`,`Not found among ${items.length} vehicles`)
                    : t('الرد ما رجعش الـ IMEI — جرّب بالاسم','No IMEI in the response — try the name'));
      refreshAfterUnit(); return;
    }
    SESSION.unit = {uid:hit.id, name:hit.name, imei:hit.imei, serial:hit.serial, plate:hit.plate, by};
    unitPaint(hit.name.length>18 ? hit.name.slice(0,17)+'…' : hit.name);
    toast(t(`اتحددت: ${hit.name} — اتطابقت على ${by}`,`Set: ${hit.name} — matched on ${by}`));
    refreshAfterUnit();
  }catch(err){ unitPaint(t('ما وصلناش للسيرفر','server unreachable'), true); }
}
function refreshAfterUnit(){
  if(cur) renderDetail(cur, []);
  if(!$('v-triage').hidden) renderTriage();
  if(!$('v-recipes').hidden && RC) renderSteps();
}

/* الاستبدال: الـ UID بيروح مكان أرقام العينة — في الإندبوينتس بتاعة العربيات بس */
/* الـ id المجرّد معناه «عربية» في /units/ بس. في /unit_groups و /unit_sensors معناه حاجة تانية خالص. */
function unitScopedEp(e){ return /^\/units\//i.test(e.p||''); }
/* عينات الكولكشن فيها فخاخ: offset بيبدأ من 50، وتواريخ من 2019.
   بنصلّحها ونقول للموظف بالظبط إيه اللي اتغيّر. */
function fixSamples(o, changes){
  const walk = (x, k) => {
    if(Array.isArray(x)) return x.map(v=>walk(v,k));
    if(x && typeof x==='object'){
      const out={};
      for(const [kk,v] of Object.entries(x)){
        if(kk==='offset' && String(v)!=='0'){
          out[kk] = (typeof v==='string') ? '0' : 0;
          changes.push(t(`الـ offset كان ${v} — رجّعناه صفر، وإلا بيتخطى أول ${v} نتيجة ويرجع فاضي`,
                         `offset was ${v} — reset to zero, otherwise it skips the first ${v} results and returns empty`));
          continue;
        }
        if((kk==='from'||kk==='to') && typeof v==='string' && /^\d{4}-\d{1,2}-\d{1,2}/.test(v)){
          const yr = Number(v.slice(0,4));
          if(yr < new Date().getFullYear()-1){
            out[kk] = today() + (kk==='from' ? ' 00:00:00' : ' 23:59:59');
            changes.push(t(`تاريخ ${kk==='from'?'البداية':'النهاية'} كان ${v.slice(0,10)} — خليناه النهاردة`,
                           `the ${kk} date was ${v.slice(0,10)} — set to today`));
            continue;
          }
        }
        out[kk]=walk(v,kk);
      }
      return out;
    }
    return x;
  };
  return walk(o, null);
}

function prepBody(e){
  const raw = (e.b||'').trim();
  if(!raw) return {text:raw, applied:false, changes:[]};
  let obj=null; try{ obj=JSON.parse(raw); }catch(_){ return {text:raw, applied:false, unparsed:true, changes:[]}; }
  const changes=[];
  let next = fixSamples(obj, changes);
  const u = SESSION.unit, scoped = unitScopedEp(e);
  const pathRes = RESOLVERS.find(r=>r.key!=='unit' && r.path.test(e.p||''));
  const before = JSON.stringify(next);
  next = injectUid(next, u?u.uid:null, null, null, scoped && !!u, pathRes);
  if(JSON.stringify(next)!==before){
    const names = depsOf(e).map(r=>{ const d=depValue(r); return d?`${dual(r.label)}: ${d.name}`:null; }).filter(Boolean);
    changes.unshift(names.length
      ? t(`الأرقام اتحطت من اللي حددته — ${names.join('، ')}`, `Ids filled from your selection — ${names.join(', ')}`)
      : t('الأرقام اتحطت من اللي حددته','Ids filled from your selection'));
  }
  return {text: JSON.stringify(next, null, 4), applied: changes.length>0, scoped, changes};
}

/* الأرقام اللي اتحلّت في الجلسة */
if(!SESSION.deps) SESSION.deps = {};

function bodyFields(e){
  const out=new Set(); const b=e.b||'';
  for(const m of b.matchAll(/"([a-z_]+)"\s*:/g)) out.add(m[1]);
  return out;
}
/* الريكوست ده محتاج أنهي أرقام؟ */
function depsOf(e){
  const f = bodyFields(e), need=[];
  for(const r of RESOLVERS){
    let hit = r.fields.some(x=>f.has(x));
    if(!hit && r.path.test(e.p||'') && (f.has('id') || f.has('ids'))) hit = true;
    if(hit) need.push(r);
  }
  return need;
}
function depValue(r){
  if(r.key==='unit') return SESSION.unit ? {id:SESSION.unit.uid, name:SESSION.unit.name} : null;
  return SESSION.deps[r.key] || null;
}
function setDep(r, v){
  if(r.key==='unit') SESSION.unit = {uid:v.id, name:v.name, imei:v.imei, serial:v.serial, plate:v.plate, by:v.by};
  else SESSION.deps[r.key] = v;
}
function missingDeps(e){ return depsOf(e).filter(r=>!depValue(r)); }

/* الريكوست ده محتاج عربية؟ */
function needsUnit(e){
  const b = e.b||'';
  return /"unit_id"|"ids"|"resources"/.test(b) || (unitScopedEp(e) && /"id"/.test(b));
}

function sesPaint(msg, bad){
  const st=$('sesState');
  st.textContent = msg;
  st.style.color = bad ? '#E0A183' : (SESSION.token ? '#7FD4B0' : '#8FA6B4');
  $('sesCopy').hidden = !SESSION.token;
  $('sesOut').hidden  = !SESSION.token;
}

/* تسجيل دخول واحد. مفيش إعادة محاولة على بيانات غلط عشان الحساب ما يتقفلش. */
async function connect(silent){
  const u=$('sesU').value.trim(), pw=$('sesP').value;
  if(!u || !pw){ sesPaint(t('اكتب اسم المستخدم وكلمة السر','Enter username and password'), true); return false; }
  if(!silent) sesPaint(t('جاري الاتصال…','Connecting…'));
  try{
    const res = await fetch(baseUrl()+'/auth/login', {method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({data:{username:u, password:pw}}) });
    const txt = await res.text(); let json=null; try{ json=JSON.parse(txt); }catch(_){}
    const inner = json && (json.status_code || (json.data && json.data.status_code));
    const tok = (res.ok && !(inner && Number(inner)>=400)) ? deepFindKey(json,'token') : null;
    if(tok){
      SESSION.user=u; SESSION.pass=pw; SESSION.token=tok; SESSION.at=Date.now();
      /* حساب جديد = كل اللي اتخزّن عن الحساب القديم يروح.
         من غير كده هتشوف عربيات عميل وانت متصل بعميل تاني. */
      SESSION.unit=null; SESSION.deps={}; UNITS_CACHE=null; LAST_RUN=null;
      Object.keys(DEP_CACHE).forEach(k=>delete DEP_CACHE[k]);
      $('unitIn').value=''; unitPaint(t('مفيش عربية محددة','no vehicle set'));
      TOKEN_MEM = tok;
      sesPaint(t('متصل — ','Connected — ') + u);
      if(cur) renderDetail(cur, []);
      return true;
    }
    SESSION.token=''; sesPaint(t('فشل الاتصال','Login failed'), true);
    if(!silent) toast(t('الدخول فشل — راجع تبويب المختبر للتفاصيل','Login failed — see the Request lab for details'));
    LAST_LOGIN_FAIL = { code: inner||res.status, txt };
    return false;
  }catch(err){
    SESSION.token=''; sesPaint(t('المتصفح ما وصلش للسيرفر','Browser could not reach the server'), true);
    LAST_LOGIN_FAIL = { code:0, txt:String(err) };
    return false;
  }
}
let LAST_LOGIN_FAIL = null;

function disconnect(){
  SESSION.user=''; SESSION.pass=''; SESSION.token=''; SESSION.at=null; SESSION.unit=null;
  SESSION.deps={}; TOKEN_MEM=''; UNITS_CACHE=null; LAST_RUN=null;
  Object.keys(DEP_CACHE).forEach(k=>delete DEP_CACHE[k]);
  $('sesU').value=''; $('sesP').value=''; $('unitIn').value=''; unitPaint(t('—','—'));
  sesPaint(t('غير متصل','Not connected'));
  toast(t('اتقطع الاتصال واتمسحت البيانات','Disconnected, credentials cleared'));
}

function looksAuthFail(code, txt){
  const t=(txt||'').toLowerCase();
  return code===401 || code===403 || t.includes('unauthenticated') || t.includes('invalid_token') ||
         t.includes('token_expired') || (t.includes('token') && t.includes('expired'));
}

/* كل ريكوست في التول بيعدي من هنا. لو التوكن خلص، بيسجل دخول تاني ويعيد المحاولة مرة واحدة. */
async function apiFetch(path, body, opts){
  opts = opts || {};
  if(!SESSION.token && SESSION.user===''){
    const ok = await connect(true);
    if(!ok) throw new Error('NO_SESSION');
  }
  const build = () => (opts.absolute ? path : baseUrl()+path) +
    (opts.noToken ? '' : (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(SESSION.token||''));
  const send = async () => {
    /* من غير مهلة، ريكوست معلّق بيسيب «جاري الإرسال…» على الشاشة للأبد */
    const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    const timer = ctl ? setTimeout(()=>ctl.abort(), 45000) : null;
    try{
    const res = await fetch(build(), {signal: ctl?ctl.signal:undefined, method:opts.method||'POST',
      headers: opts.headers || {'Content-Type':'application/json','Accept':'application/json'},
      body: body!=null ? (typeof body==='string'?body:JSON.stringify(body)) : undefined});
    const txt = await res.text(); let json=null, pretty=txt;
    try{ json=JSON.parse(txt); pretty=JSON.stringify(json,null,2); }catch(_){}
    const inner = json && (json.status_code || (json.data && json.data.status_code));
    const code = inner ? Number(inner) : res.status;
    return { ok: res.ok && !(inner && Number(inner)>=400), code, txt, json, pretty };
    } finally { if(timer) clearTimeout(timer); }
  };
  let r = await send();
  logCall((opts.method||'POST')+' '+path, r.code, r.ok);
  if(!r.ok && looksAuthFail(r.code, r.txt) && SESSION.user && !opts.noRetry){
    const re = await connect(true);
    if(re){ r = await send(); r.relogged = true; }
  }
  return r;
}

/* ================= مختبر الريكوست ================= */
/* ريكوستات ممنوع المختبر يلمسها — إعادة المحاولة عليها ممكن تمسح داتا عميل */
const DESTRUCTIVE = /(delete|forever|bulk[-_]delete|reset|logout|restore|unassign|un-assign|import|set_status|edit|add|send)/i;
/* ريكوستات الدخول: إعادة المحاولة عليها بتقفل حسابات العملاء */
const NO_RETRY = /^\/auth\/(login|send_login_otp|verify_login_otp|login_as|forgot|reset)/i;


/* الصيغ البديلة — كلها مبنية على أنماط موجودة فعلًا في الكولكشن، مش تخمين */
function labVariants(e, override){
  const out=[], base=baseUrl();
  const url = base + e.p + (e.t ? '?token=' + encodeURIComponent(SESSION.token||'') : '');
  let obj=override||null;
  if(!obj){ try{ const t2=bodyOf(e); obj = t2 ? JSON.parse(t2) : null; }catch(_){ obj=null; } }
  const H={'Content-Type':'application/json','Accept':'application/json'};
  out.push({n:'زي ما هو في الكولكشن', url, body:obj, h:{'Content-Type':'application/json'}});
  out.push({n:'مع هيدر القبول', url, body:obj, h:H});
  if(obj && !('data' in obj)) out.push({n:'تغليف البودي في data', url, body:{data:obj}, h:H});
  if(obj && obj.data && obj.data.data) out.push({n:'فك التغليف المزدوج', url, body:{data:obj.data.data}, h:H});
  if(obj && obj.data && typeof obj.data==='object'){
    const d=obj.data;
    if('projection' in d || 'simplify' in d){
      const d2={...d}; delete d2.projection; delete d2.simplify;
      out.push({n:'من غير projection', url, body:{data:d2}, h:H});
    }
    if('limit' in d){
      out.push({n:'الأرقام كنصوص', url, body:{data:{...d, limit:String(d.limit), offset:String(d.offset==null?0:d.offset)}}, h:H});
    }
    const keep={}; ['id','ids','unit_id','user_id','limit','offset'].forEach(k=>{ if(k in d) keep[k]=d[k]; });
    if(Object.keys(keep).length && Object.keys(keep).length < Object.keys(d).length)
      out.push({n:'أقل بودي ممكن', url, body:{data:keep}, h:H});
  }
  if(!obj) out.push({n:'بودي فاضي', url, body:{data:{}}, h:H});
  return out;
}

async function labRunLadder(e){
  const out = $('tryout');
  if(NO_RETRY.test(e.p||'')){ out.innerHTML=`<div class="note warn" style="margin-top:12px">${t('إعادة المحاولة على ريكوستات الدخول ممنوعة — بتقفل حسابات العملاء.','Retrying login requests is blocked — it locks customer accounts.')}</div>`; return; }
  if(e.t && !SESSION.token){ out.innerHTML=`<div class="note warn" style="margin-top:12px">${t('اتصل من الشريط اللي فوق الأول.','Connect from the top bar first.')}</div>`; return; }
  const vs = labVariants(e), tried = [];
  let win = null;
  for(let n=0; n<vs.length; n++){
    const v = vs[n];
    out.innerHTML = renderLadder(tried, t(`جاري تجربة الصيغة ${n+1} من ${vs.length}: ${v.n}`,`Trying variant ${n+1} of ${vs.length}: ${v.n}`));
    try{
      const res = await fetch(v.url, {method:e.m||'POST', headers:v.h, body: v.body?JSON.stringify(v.body):undefined});
      const txt = await res.text(); let json=null, pretty=txt;
      try{ json=JSON.parse(txt); pretty=JSON.stringify(json,null,2); }catch(_){}
      const inner = json && (json.status_code || (json.data && json.data.status_code));
      const code = inner ? Number(inner) : res.status;
      const ok = res.ok && !(inner && Number(inner)>=400);
      tried.push({name:v.n, code, ok, why: ok?'':diagnose(code, txt),
                  sent:{m:e.m||'POST', url:v.url, h:v.h, b: v.body?JSON.stringify(v.body,null,4):''}});
      if(ok){ win = {v, code, pretty, json}; break; }
    }catch(err){
      out.innerHTML = `<div class="note warn" style="margin-top:12px">
        <b>المتصفح ما وصلش للسيرفر.</b> استضيف الصفحة على نفس دومين الـ API، أو انسخ الصيغ كأوامر وشغّلها من الترمنال.</div>`;
      return;
    }
  }
  if(!win){
    const last = tried[tried.length-1];
    out.innerHTML = renderLadder(tried, null)
      + (last && last.sent ? echoReq(last.sent.m, last.sent.url, last.sent.h, last.sent.b) : '')
      + `<div class="note warn" style="margin-top:12px">
      <b>${t('كل الصيغ فشلت.','Every variant failed.')}</b> ${t('يبقى المشكلة مش في شكل الريكوست. صعّدها لمصر بالجدول ده — فيه كل اللي جربناه وردّ كل واحدة.','So the request shape is not the problem. Escalate with this table — it lists every variant tried and what each returned.')}</div>
      <div class="row"><button class="btn warn" id="labEsc">${t('نسخ رسالة التصعيد','Copy escalation')}</button></div>`;
    $('labEsc').onclick = ()=>openModal('رسالة التصعيد',
      `تصعيد لتيم التطوير — مصر\n\nالريكوست: ${e.m} ${e.p}\nالبيئة: ${baseUrl()}\n\nجربنا ${tried.length} صيغة وكلها فشلت:\n` +
      tried.map((t,i)=>`${i+1}) ${t.name} — رجع ${t.code}`).join('\n') +
      `\n\nالمطلوب: الشكل الصحيح للطلب، ونموذج رد ناجح، ومعنى الكود اللي رجع.`, true);
    return;
  }
  rememberRun(e, win.v.body ? JSON.stringify(win.v.body, null, 4) : '', {ok:true, code:win.code, json:win.json, pretty:win.pretty});
  const safeUrl = win.v.url.split(SESSION.token||'\u0000').join('<YOUR_TOKEN>');
  const safeResp = redactToken(win.pretty);
  out.innerHTML = renderLadder(tried, null) +
   `<div class="note sig" style="margin-top:12px">
      <b>${t('اشتغلت بالصيغة:','Worked with variant:')}</b> ${esc(win.v.n)} — ${win.code}.
      ${tried.length>1 ? `<br>الصيغة الأصلية فشلت — الفرق ظاهر في الرد الجاهز تحت.` : ''}</div>
    <h3 style="margin:16px 0 6px; font-size:12px; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)">${t('الرد الجاهز للعميل','Ready bundle for the customer')}</h3>
    <pre class="pre">${esc(labBundle(e, win, safeUrl, safeResp))}</pre>
    <div class="row">
      <button class="btn sig" id="labCopy">${t('نسخ الرد الجاهز','Copy bundle')}</button>
      <button class="btn ghost" id="labCopyResp">${t('نسخ الرد لوحده','Copy response only')}</button>
    </div>
    <div class="note warn" style="margin-top:10px">التوكن اتشال أوتوماتيك. بص عليه بعينك قبل ما تبعته — ممكن يكون فيه بيانات ما ينفعش تخرج للعميل.</div>`;
  $('labCopy').onclick = ()=>copy(packetFor(e).text, t('اتنسخ الرد الكامل','Full reply copied'));
  $('labCopyResp').onclick = ()=>copy(safeResp, t('اتنسخ الرد','Response copied'));
}

function redactToken(t){
  let x = t || '';
  if(SESSION.token) x = x.split(SESSION.token).join('<YOUR_TOKEN>');
  return x.replace(/("token"\s*:\s*")[^"]{20,}(")/g, '$1<YOUR_TOKEN>$2');
}

function renderLadder(tried, busy){
  if(!tried.length && !busy) return '';
  return `<table class="kv" style="margin-top:12px">
    <tr><td style="font-family:var(--ar); color:var(--ink); font-weight:600">${t('الصيغة','Variant')}</td>
        <td style="font-weight:600">${t('النتيجة','Result')}</td></tr>` +
    tried.map(t=>`<tr><td style="font-family:var(--ar); color:var(--ink)">${esc(t.name)}</td>
      <td>${t.ok ? `<span class="tagv">${LANG==='en'?'passed':'نجحت'} — ${t.code}</span>` : `<span class="tagu">${t.code}</span> <span style="font-size:12px; color:var(--muted)">${esc(String(t.why).replace(/<[^>]+>/g,' ').slice(0,90))}</span>`}</td></tr>`).join('') +
    (busy ? `<tr><td style="font-family:var(--ar)">${esc(busy)}</td><td>…</td></tr>` : '') + '</table>';
}

function labBundle(e, win, safeUrl, safeResp){
  const hdr = Object.entries(win.v.h).map(([k,v])=>`${k}: ${v}`).join('\n');
  return `Verified on ${new Date().toISOString().slice(0,10)} against ${baseUrl()}

REQUEST
${e.m} ${safeUrl}

HEADERS
${hdr}

BODY
${win.v.body ? JSON.stringify(win.v.body, null, 2) : '(none)'}

RESPONSE  (${win.code})
${safeResp.slice(0,3000)}

NOTES
- Obtain the token from POST ${baseUrl()}/auth/login with body {"data":{"username":"...","password":"..."}}; it is returned in data.token.
- The token is passed as a "token" query parameter, not in an Authorization header.
- Almost every endpoint uses POST, including read operations.
- The request body is always wrapped in a "data" object.
- IMPORTANT: the API returns HTTP 200 even when a call fails. Read "status_code" and "message" from the response body rather than relying on the HTTP status.`;
}

/* بنحط الـ UID مكان أرقام العينة اللي في الكولكشن، والتواريخ مكان تواريخها */
function injectUid(obj, uid, from, to, unitScoped, pathRes){
  const walk = (o, parentKey) => {
    if(Array.isArray(o)){
      if(parentKey==='ids' || parentKey==='resources' || parentKey==='unit_ids') return [uid];
      return o.map(x=>walk(x, parentKey));
    }
    if(o && typeof o==='object'){
      const out={};
      for(const [k,v] of Object.entries(o)){
        if(k==='unit_id'){ out[k]=uid; continue; }
        if(k==='id' && unitScoped && typeof v!=='object'){ out[k]=uid; continue; }
        /* الـ id المجرّد في /events/ معناه رقم حدث، وفي /zones/ رقم منطقة... */
        if((k==='id'||k==='ids') && pathRes && typeof v!=='object' || (k==='ids' && pathRes && Array.isArray(v))){
          const dv = depValue(pathRes);
          if(dv){ out[k] = (k==='ids') ? [dv.id] : dv.id; continue; }
        }
        const dep = RESOLVERS.find(r=>r.key!=='unit' && r.fields.indexOf(k)>=0);
        if(dep && SESSION.deps[dep.key] && typeof v!=='object'){ out[k]=SESSION.deps[dep.key].id; continue; }
        if(from && k==='from' && typeof v==='string' && /\d{4}-\d{2}/.test(v)){ out[k]=from; continue; }
        if(to   && k==='to'   && typeof v==='string' && /\d{4}-\d{2}/.test(v)){ out[k]=to;   continue; }
        if(k==='filters' && v && typeof v==='object' && 'id' in v){ out[k]={...v, id:uid}; continue; }
        if(k==='offset'){ out[k] = (typeof v==='string') ? '0' : 0; continue; }   // عينة الكولكشن فيها offset=50 وبترجع فاضي
        out[k]=walk(v,k);
      }
      return out;
    }
    return o;
  };
  return walk(obj, null);
}

  btn.disabled=true;
  const step=(m)=>{ out.innerHTML=`<div class="note" style="margin-top:12px">${esc(m)}</div>`; };
  try{
    step(t('١ من ٣ — بندوّر على العربية…','1 of 3 — locating the vehicle…'));

      UNITS_CACHE = list.json;
    }
    const {hit, items, by, hasImei} = matchByName(UNITS_CACHE, imei);
    if(!hit){ out.innerHTML=`<div class="note warn" style="margin-top:12px">${hasImei
        ? t(`ما لقيناش الرقم ده بين ${items.length} عربية في الحساب ده.`,`Not found among the ${items.length} vehicles on this account.`)

    step(t('٢ من ٣ — لقينا العربية، بنجرّب الإندبوينت…','2 of 3 — vehicle found, running the endpoint…'));
    let tpl=null; try{ tpl = e.b ? JSON.parse(e.b) : {data:{}}; }catch(_){ tpl={data:{}}; }

      <pre class="pre" style="margin-top:8px">${esc(quickCurl(e, body))}</pre>`; return; }

      : `<div class="row"><button class="btn warn" id="qkEsc">${t('تصعيد بكل اللي جربناه','Escalate with everything tried')}</button></div>`}`;
    if(okRun){
      $('qkCopyAll').onclick = ()=>copy(quickBundle(e, hit, curl, resp), t('اتنسخ','Copied'));
      $('qkCopyCurl').onclick = ()=>copy(curl, t('اتنسخ الـ curl','curl copied'));
    } else {

    }

function quickCurl(e, body){
  const url = baseUrl() + e.p + (e.t ? '?token=<YOUR_TOKEN>' : '');
  return `curl -X ${e.m||'POST'} "${url}" \\\n  -H "Content-Type: application/json" \\\n  -H "Accept: application/json" \\\n  -d '${JSON.stringify(body, null, 2)}'`;
}
function quickBundle(e, hit, curl, resp){
  return `Verified on ${new Date().toISOString().slice(0,10)} against ${baseUrl()}

Vehicle: ${hit.name}
UID: ${hit.id}${hit.imei?`\nIMEI: ${hit.imei}`:''}

REQUEST
${curl}

RESPONSE
${resp.slice(0,3000)}

NOTES
- The UID above is the identifier the API works with. The IMEI identifies the physical device and is not accepted by these endpoints.
- Get your token from POST ${baseUrl()}/auth/login with body {"data":{"username":"...","password":"..."}}; it is returned in data.token, and is passed as a "token" query parameter rather than a header.
- Almost every endpoint uses POST, and the body is always wrapped in a "data" object.
- IMPORTANT: the API returns HTTP 200 even when a call fails. Read "status_code" and "message" from the response body rather than relying on the HTTP status.`;
}

  const box=$('trLog'); if(!box) return;
  if(!LOG.length){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="col-h"><h2>${t('اللي اتنفذ في الجلسة دي','Run in this session')}</h2>
    <em><button class="btn ghost" id="logCopy" style="padding:3px 10px; font-size:12px">${t('نسخ','Copy')}</button></em></div>
    <table class="kv">${LOG.slice(0,15).map(l=>`<tr>
      <td style="font-family:var(--mono); width:70px">${l.at}</td>
      <td>${esc(l.label)} — ${l.ok?`<span class="tagv">${l.code}</span>`:`<span class="tagu">${l.code}</span>`}</td></tr>`).join('')}</table>`;
  $('logCopy').onclick = ()=>copy(LOG.map(l=>`${l.at}  ${l.label}  ${l.ok?'OK':'FAIL'} ${l.code}`).join('\n'), t('اتنسخ','Copied'));
}

/* ---------- بوابة التصعيد: مفيش تصعيد من غير أدلة ---------- */
const EVIDENCE = [
 {k:'req', ar:'الـ curl كامل — اللينك والهيدرز والبودي', en:'The full curl — URL, headers and body'},
 {k:'res', ar:'الرد كامل زي ما رجع', en:'The full response exactly as returned'},
 {k:'env', ar:'البيئة والوقت', en:'Environment and timestamp'},
 {k:'one', ar:'UID عربية واحدة نجرّب عليها', en:'The UID of one vehicle to reproduce with'},
 {k:'try', ar:'اللي جربناه إحنا قبل التصعيد', en:'What we tried before escalating'}
];
function openEscalation(subject){
  const en = LANG==='en';
  $('mtitle').textContent = t('تصعيد لتيم التطوير','Escalation to development');
  $('mbody').innerHTML = `
    <div class="note warn" style="margin-bottom:12px">${t('ما تبعتش من غير الأدلة دي. كل بند ناقص بيرجّع التذكرة بسؤال وبيضيّع يومين.',
      'Do not send without this evidence. Every missing item bounces the ticket back and costs two days.')}</div>
    <div id="evBox">${EVIDENCE.map(e=>`<label style="display:block; padding:6px 0; font-size:14px; cursor:pointer">
      <input type="checkbox" data-ev="${e.k}" style="margin-inline-end:8px">${esc(en?e.en:e.ar)}</label>`).join('')}</div>
    <textarea class="out ${en?'':'ar'}" id="mtext" style="margin-top:10px"></textarea>
    <div class="row"><button class="btn sig" id="mcopy">${t('نسخ','Copy')}</button>
      <span id="evWarn" style="font-size:12.5px; color:var(--alert); align-self:center"></span></div>`;
  const build = ()=>{
    const boxes=[...$('evBox').querySelectorAll('input')];
    const have=boxes.filter(b=>b.checked).map(b=>EVIDENCE.find(e=>e.k===b.dataset.ev));
    const miss=boxes.filter(b=>!b.checked).map(b=>EVIDENCE.find(e=>e.k===b.dataset.ev));
    const log = LOG.slice(0,10).map(l=>`  ${l.at}  ${l.label} — ${l.ok?'OK':'FAIL'} ${l.code}`).join('\n') || (en?'  (nothing run)':'  (ما اتنفذش حاجة)');
    $('evWarn').textContent = miss.length ? t(`ناقص ${miss.length}`,`${miss.length} missing`) : '';
    $('mtext').value = en
      ? `Escalation to the development team

Subject: ${subject}
Environment: ${baseUrl()}

Attached evidence:
${have.length?have.map(e=>'  - '+e.en).join('\n'):'  - none'}
${miss.length?`\nStill missing (please tell us if any of these is required):\n${miss.map(e=>'  - '+e.en).join('\n')}`:''}

What the support tool ran in this session:
${log}

What we need back:
  - Confirmation of the correct request for this case
  - A sample successful response
  - The meaning of the returned error codes, so we can record them and stop asking`
      : `تصعيد لتيم التطوير — مصر

الموضوع: ${subject}
البيئة: ${baseUrl()}

الأدلة المرفقة:
${have.length?have.map(e=>'  - '+e.ar).join('\n'):'  - مفيش'}
${miss.length?`\nلسه ناقص:\n${miss.map(e=>'  - '+e.ar).join('\n')}`:''}

اللي التول نفّذته في الجلسة دي:
${log}

المطلوب منكم:
  - تأكيد الريكوست الصح للحالة دي
  - نموذج رد ناجح
  - معنى أكواد الأخطاء اللي رجعت، عشان نسجّلها وما نسألش تاني`;
  };
  $('evBox').querySelectorAll('input').forEach(b=>b.onchange=build);
  build();
  $('mcopy').onclick = ()=>copy($('mtext').value, t('اتنسخ','Copied'));
  $('mask').hidden = false;
}

/* ================= الدليل ================= */
function renderDocs(){
  const cur = DOCS.version;
  const newest = DOCS.history[0];
  const secNew = DOCS.sections.filter(x=>x.since===cur);
  const line = x => `<li style="margin-bottom:5px">${esc(x)}</li>`;
  $('docsBox').innerHTML = `
   <div class="row" style="margin-bottom:10px"><button class="btn ghost" id="docBack">${t('‹ رجوع','‹ Back')}</button></div>
   <div class="panel" style="margin-bottom:14px">
     <div class="p-head">
       <div class="crumb">${t('دليل الاستخدام','User guide')}</div>
       <div class="path" style="font-family:var(--ar)">${t('مساعد الإنتجريشن','Integration Helper')}
         <span class="tagv" style="font-size:12px">v${esc(cur)}</span></div>
       <p style="margin:6px 0 0; color:var(--muted); font-size:13px">${esc(DOCS.date)}</p>
     </div>
     <div class="sec">
       <div class="note sig" style="border-inline-start-width:4px">
         <b>${t('الجديد في النسخة دي','New in this release')} — v${esc(newest.v)}</b>
         <ul style="margin:8px 0 0; padding-inline-start:20px; font-size:13.5px">
           ${dual(newest.items).map(line).join('')}</ul>
       </div>
       <div class="row">
         <a class="btn sig" id="docPdf" href="docs.pdf" download="afaqy-support-guide-v${esc(cur)}.pdf"
            target="_blank" rel="noopener" style="text-decoration:none; display:inline-block">${t('نزّل الدليل','Download the guide')}</a>
         <button class="btn ghost" id="docPrint" hidden>${t('اطبع الصفحة','Print this page')}</button>
         <button class="btn ghost" id="docHist">${t('كل النسخ','All releases')}</button>
       </div>
       <div id="docPdfNote"></div>
       <div id="docHistBox"></div>
     </div>
   </div>
   ${DOCS.sections.map(sec=>{
     const isNew = sec.since===cur;
     return `<div class="panel" style="margin-bottom:10px; ${isNew?'border-color:var(--signal); border-inline-start:4px solid var(--signal)':''}">
       <div class="sec" style="border-top:0">
         <h3 style="font-family:var(--ar); font-size:15px; letter-spacing:0; text-transform:none; color:var(--ink)">
           ${esc(dual(sec.t))}
           ${isNew?`<span class="tagv">${t('جديد','new')} v${esc(cur)}</span>`:''}
         </h3>
         <ul style="margin:6px 0 0; padding-inline-start:20px; font-size:14px; line-height:1.95; color:var(--ink-2)">
           ${dual(sec.b).map(line).join('')}</ul>
       </div></div>`;
   }).join('')}`;
  $('docBack').onclick = ()=>goBack();
  $('docHist').onclick = ()=>{
    const b=$('docHistBox');
    b.innerHTML = b.innerHTML ? '' : `<table class="kv" style="margin-top:10px">${DOCS.history.map(h=>
      `<tr><td style="width:70px"><b>v${esc(h.v)}</b><br><span style="font-size:11px; color:var(--muted)">${esc(h.date)}</span></td>
       <td><ul style="margin:0; padding-inline-start:18px; font-size:13.5px">${dual(h.items).map(line).join('')}</ul></td></tr>`).join('')}</table>`;
  };
  /* لو الملف مش موجود جنب الصفحة (فتحتها من الجهاز مثلًا) نرجّع خيار الطباعة */
  fetch('docs.pdf', {method:'HEAD'})
    .then(r=>{ if(!r.ok) throw 0; })
    .catch(()=>{
      $('docPdf').hidden = true;
      $('docPrint').hidden = false;
      $('docPrint').onclick = ()=>window.print();
      $('docPdfNote').innerHTML = `<div class="note" style="margin-top:10px">${t(
        'ملف الدليل مش موجود جنب الصفحة دي. لو فتحت الأداة من اللينك هتلاقيه، ولو شغال من الجهاز استخدم الطباعة واحفظ PDF.',
        'The guide file is not next to this page. Open the tool from its link to get it, or use print and save as PDF.')}</div>`;
    });
}

/* ---------------- views ---------------- */
const INTROS = {
  trIntro:{ar:`أي تذكرة تبدأ من هنا. اختار العرض اللي العميل قاله، والتول تديك: اللي ما تعملهوش، الخطوات بالترتيب، والرد الجاهز. الهدف إن الرد يبقى واحد مهما كان اللي رد.`,
    en:`Every ticket starts here. Pick the symptom the customer reported and the tool gives you what not to do, the steps in order, and a ready reply — so the answer is the same whoever handles it.`},
  rcIntro:{ar:`السيناريو بينفّذ سلسلة ريكوستات بالترتيب وبينقل النتيجة من خطوة للي بعدها لوحده. كل خطوة مش بتشتغل غير لما تضغط عليها — ومفيش حاجة بتتخزن.`,
    en:`A scenario runs a chain of requests in order and carries each result into the next step automatically. No step runs until you press it, and nothing is stored.`},
  faqIntro:{ar:`كل اللي في الصفحة دي متأكَّد منه من الكولكشن نفسه. اللي مش متأكَّد منه مكتوب عليه <span class="tagu">يحتاج تأكيد</span> — دي بتتصعّد لتيم مصر ولا تتقال للعميل على إنها مؤكدة.`,
    en:`Everything here is verified against the collection itself. Anything unverified is marked <span class="tagu">needs confirmation</span> — escalate those rather than stating them to a customer as fact.`}
};
function paintIntros(){ Object.entries(INTROS).forEach(([id,v])=>{ const el=$(id); if(el) el.innerHTML = dual(v); }); }

const VIEWS = ['triage','search','recipes','docs','faq'];
let VIEW_STACK = [];
function goBack(){
  if(VIEW_STACK.length>1){ VIEW_STACK.pop(); showView(VIEW_STACK[VIEW_STACK.length-1], true); }
  else showView('triage', true);
}
function showView(v, noPush){
  if(!noPush){
    if(VIEW_STACK[VIEW_STACK.length-1]!==v) VIEW_STACK.push(v);
    if(VIEW_STACK.length>20) VIEW_STACK.shift();
    try{ history.pushState({v}, '', '#'+v); }catch(_){}
  }
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.view===v));
  ['search','faq','recipes','triage','docs'].forEach(x=>$('v-'+x).hidden = x!==v);
  if(v==='docs') renderDocs();
  paintIntros();
  if(v==='triage') renderTriage();
  if(v==='faq') renderFaq();
  if(v==='search') refreshLeft();
  if(v==='recipes'){ if(!RC){ $('rcHome').hidden=false; $('rcRun').hidden=true; renderRecipeCards(); } }
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));
window.addEventListener('popstate', ev=>{
  const v = (ev.state && ev.state.v) || (location.hash||'').slice(1);
  if(VIEWS.indexOf(v)>=0) showView(v, true);
});

/* ---------------- wiring ---------------- */
let deb;
$('q').addEventListener('input', ev=>{
  clearTimeout(deb);
  deb = setTimeout(()=>{
    lastQ = ev.target.value;
    if(!lastQ.trim()){ MODE='mod'; refreshLeft(); resetEmpty(); return; }
    MODE='res'; paintModeBtns();
    const r = search(lastQ);
    renderResults(r);
    if(r.length){ select(r[0].e, r[0].why); return; }
    /* لسه بيكتب؟ ما نخوّفوش برسالة «مفيش» */
    const longest = lastQ.trim().split(/\s+/).reduce((a,b)=>b.length>a?b.length:a, 0);
    if(longest < 3) typingState();
    else emptyState(lastQ);
  }, 130);
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  $('q').value = c.dataset.ex;
  $('q').dispatchEvent(new Event('input'));
  $('q').focus();
});
function baseUrlOk(){
  const u = baseUrl();
  return /^https?:\/\/[^\s/]+$/i.test(u.replace(/\/+$/,''));
}
$('baseCustom').addEventListener('input', ()=>{
  const bad = $('baseUrl').value==='__custom' && $('baseCustom').value.trim() && !baseUrlOk();
  $('baseCustom').style.borderColor = bad ? '#8A4A1C' : '#33475C';
  $('baseCustom').title = bad ? t('العنوان لازم يبدأ بـ http وما فيهوش مسار','Must start with http and contain no path') : '';
});
$('baseUrl').addEventListener('change', ev=>{
  $('baseCustom').hidden = ev.target.value !== '__custom';
  if(cur) renderDetail(cur, []);
  if(!$('v-faq').hidden) renderFaq();
});
$('sesGo').onclick  = ()=>connect(false);
$('sesOut').onclick = disconnect;
$('sesCopy').onclick= ()=>copy(SESSION.token, t('اتنسخ التوكن','Token copied'));
$('unitGo').onclick = ()=>resolveUnit($('unitIn').value);
$('unitIn').addEventListener('keydown', ev=>{ if(ev.key==='Enter') resolveUnit($('unitIn').value); });
$('mdRes').onclick = ()=>{ MODE='res'; refreshLeft(); };
$('mdMod').onclick = ()=>{ MODE='mod'; refreshLeft(); };
$('sesP').addEventListener('keydown', ev=>{ if(ev.key==='Enter') connect(false); });

function resetEmpty(){
  $('detail').innerHTML = `<div class="panel"><div class="empty">
    <b>${t('اكتب سؤال العميل فوق','Type the customer\u0027s question above')}</b>
    ${t(`بندوّر لك جوه ${EPS.length} ريكوست ونطلّع الريكوست الصح بمثال جاهز للنسخ.`,
        `We search all ${EPS.length} requests and hand you the right one with a ready-to-copy example.`)}<br>
    ${t('عايز تجرّبه على حساب عميل؟ اكتب اسم المستخدم وكلمة السر فوق واضغط اتصال — التوكن بيتجاب لوحده.',
        'Want to run it against a customer account? Enter the username and password above and press Connect — the token is fetched for you.')}
  </div></div>`;
}
/* شبكة أمان: أي خطأ في الرسم كان بيسيب الشاشة فاضية والموظف مش عارف حصل إيه.
   دلوقتي بيظهر سبب واضح وزرار إعادة تحميل. */
function crashScreen(err, where){
  try{
    const box = document.getElementById('detail') || document.body;
    box.innerHTML = `<div class="panel"><div class="sec">
      <div class="note warn">
        <b>${t('حصل خطأ في الأداة','Something broke in the tool')}</b><br>
        ${t('المكان','Where')}: <code>${String(where||'—').slice(0,60)}</code><br>
        <code style="white-space:pre-wrap">${String(err && err.message || err).slice(0,200)}</code><br><br>
        ${t('اضغط تحديث. لو تكررت، ابعت اللقطة دي لمسؤول الأداة.','Press reload. If it repeats, send this screenshot to whoever maintains the tool.')}
      </div>
      <div class="row"><button class="btn sig" onclick="location.reload()">${t('تحديث','Reload')}</button></div>
    </div></div>`;
  }catch(_){}
}
function guard(fn, where){
  return function(){ try{ return fn.apply(this, arguments); }
                     catch(err){ console.error(where, err); crashScreen(err, where); }; };
}

function boot(){
resetEmpty();
paintIntros();
refreshLeft();
renderRecent();
$('langBtn').onclick = ()=>setLang(LANG==='ar'?'en':'ar');
$('updGo').onclick = applyUpdate;
$('updSkip').onclick = ()=>{ $('updBar').hidden = true; };
checkUpdate();
setInterval(checkUpdate, 10*60*1000);
initPWA();
$('q').setAttribute('title', t('اضغط / للوصول السريع','Press / to jump here'));
unitPaint(t('مفيش عربية محددة','no vehicle set'));
$('verTag').textContent = 'v'+DOCS.version;
(function(){ const h=(location.hash||'').slice(1);
  if(VIEWS.indexOf(h)>=0 && h!=='triage') showView(h); else VIEW_STACK=['triage']; })();
$('q').focus();
}
renderDetail = guard(_renderDetail, 'renderDetail');
renderTriage = guard(renderTriage, 'renderTriage');
renderFaq    = guard(renderFaq,    'renderFaq');
renderDocs   = guard(renderDocs,   'renderDocs');
renderRecipe = guard(renderRecipe, 'renderRecipe');
showView     = guard(showView,     'showView');
window.addEventListener('error', ev=>{ if(ev && ev.error) console.error('uncaught', ev.error); });

authGate(boot);
</script>
</body>
